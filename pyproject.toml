[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "comunicamundo-v8"
version = "2.0.0"
description = "Hefesto editorial planning product"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "google-auth>=2.40,<3",
  "google-cloud-storage==3.13.1",
  "google-genai==2.19.0",
  "pydantic>=2.12,<3",
  "psycopg[binary,pool]==3.3.5",
  "pypdf==6.10.0",
  "requests>=2.32,<3",
  "uvicorn==0.35.0",
]

[project.scripts]
comunicamundo-v8-worker = "comunicamundo_v8.hefesto.worker:main"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.1.0"]
document = [
  "docling[asr]==2.129.0",
  "docling-slim[format-video]==2.129.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comunicamundo_v8 = ["web/*.html", "web/assets/*.css", "web/assets/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
