[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "comunicamundo-v4"
version = "1.1.0"
description = "Hefesto paragraph-first editorial intelligence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-cloud-storage==3.13.1",
  "google-genai==2.19.0",
  "pydantic>=2.12,<3",
  "psycopg[binary,pool]==3.3.5",
  "pypdf==6.10.0",
]

[project.scripts]
comunicamundo-v4-worker = "comunicamundo_v4.hefesto.worker:main"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
