[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "comunicamundo-v4"
version = "0.1.0"
description = "ComunicAmundo V4 editorial intelligence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-cloud-firestore==2.28.1",
  "google-cloud-storage==3.13.1",
  "llama-index-core==0.14.24",
  "llama-index-embeddings-google-genai==0.5.1",
  "llama-index-llms-google-genai==0.10.0",
  "pydantic>=2.12,<3",
]

[project.scripts]
comunicamundo-v4-worker = "comunicamundo_v4.hefesto.worker:main"

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
