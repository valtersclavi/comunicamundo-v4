<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hefesto V8</title><link rel="stylesheet" href="/assets/styles.css"><style>main{max-width:900px;margin:24px auto;padding:16px}label{display:block;margin:12px 0}input,textarea,select{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}button{margin:8px 8px 8px 0}.error{color:#a22}section{margin:20px 0;padding:20px;border:1px solid #ddd;border-radius:12px}[hidden]{display:none!important}</style></head><body><main>
<h1>Hefesto V8</h1><p>Você dirige a obra. As fontes dão o fundamento.</p><p id="error" class="error" role="alert"></p>
<section id="login"><h2>Entrar</h2><form id="login-form"><label>Usuário<input name="username" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></section>
<div id="workspace" hidden><button id="new">Novo projeto</button><button id="refresh">Meus projetos</button><div id="projects"></div>
<section id="input"><h2>Direção da obra</h2><form id="brief"><label>Tema<textarea name="theme" required></textarea></label><label>Abordagem<textarea name="approach" required></textarea></label><label>Público<input name="audience" required></label><label>Produto<select name="product"><option>podcast</option><option>voiceover</option><option>artigo</option></select></label><label>Duração em minutos<input name="duration_minutes" type="number" min="1" value="20" required></label><label>Idioma<input name="output_language" value="pt-BR" required></label><label>Fontes<select id="source-mode"><option value="provided">Vou fornecer fontes</option><option value="search">Buscar fontes para mim</option></select></label><div id="sources"><label>Arquivos<input id="files" type="file" multiple></label><label>URLs públicas, uma por linha<textarea id="urls" placeholder="https://..."></textarea></label></div><button>Preparar Projeto Editorial</button></form></section>
<section id="run" hidden><h2 id="status"></h2><p id="job"></p><p id="metrics"></p><div id="manifest"></div><button id="resume" hidden>Retomar processamento</button>
<div id="pe" hidden><h3>Projeto Editorial</h3><label>Versão<select id="versions"></select></label><pre id="proposal"></pre><label>Remoque: como você quer mudar a direção?<textarea id="message"></textarea></label><button id="revise">Reconsiderar proposta</button><button id="approve">Aprovar esta versão</button><button id="produce">Produzir obra</button></div>
<div id="work" hidden><h3 id="work-title"></h3><pre id="body"></pre><details><summary>Fundamentação</summary><div id="support"></div></details></div></section></div></main><script src="/assets/v8.js"></script></body></html>
