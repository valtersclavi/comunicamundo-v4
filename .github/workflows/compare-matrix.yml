name: Compare persisted editorial project with matrix
on:
  workflow_dispatch:
    inputs:
      reference_execution_run_id:
        description: Persisted reference run with a proposed Editorial Project
        required: true
        type: string
      comparison_execution_run_id:
        description: Optional existing comparison ID to resume; leave empty for a new run
        required: false
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  compare-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      PROJECT_ID: comunicamundo-v4
      REGION: us-central1
      JOB_NAME: hefesto-v4-rebuild
      REFERENCE: ${{ inputs.reference_execution_run_id }}
      COMPARISON: ${{ inputs.comparison_execution_run_id }}
    steps:
      - name: Prepare independent run
        run: |
          [[ "${REFERENCE}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          if [[ -z "${COMPARISON}" ]]; then
            COMPARISON="$(python -c 'import uuid; print(uuid.uuid4())')"
          fi
          [[ "${COMPARISON}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          echo "COMPARISON=${COMPARISON}" >> "${GITHUB_ENV}"
          echo "Comparison execution ID: ${COMPARISON}" >> "${GITHUB_STEP_SUMMARY}"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
          service_account: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build matrix project from persisted inputs
        run: |
          gcloud run jobs execute "${JOB_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --args="compare-matrix,--execution-run-id=${REFERENCE},--comparison-execution-run-id=${COMPARISON}" \
            --wait
