name: one-shot-luto-understanding-inspect
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hefesto-v4-luto-understanding-inspect
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  PROOF_SERVICE: hefesto-v4-luto-understanding-inspect
  BUCKET: comunicamundo-v4-hefesto-30524898837
  REQUEST_URI: gs://comunicamundo-v4-hefesto-30524898837/requests/13101c35-723d-43fe-9b45-0082b49c0a76.json
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  RUNTIME_SA: hefesto-v4-sa@comunicamundo-v4.iam.gserviceaccount.com
jobs:
  inspect-understanding:
    if: ${{ contains(github.event.head_commit.message, '[luto-understanding-inspect]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Prepare temporary inspection service
        run: |
          set -euo pipefail
          pinned_image="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          deployed_sa="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.serviceAccountName)')"
          test -n "${pinned_image}"
          test "${deployed_sa}" = "${RUNTIME_SA}"
          proof_token="$(openssl rand -hex 32)"
          cat > /tmp/inspect_service.py <<'PY'
          import hmac
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from comunicamundo_v4.hefesto.worker import run_plan_command, run_propose_axis_command

          REQUEST_URI = os.environ["PROOF_REQUEST_URI"]
          PROOF_TOKEN = os.environ["PROOF_TOKEN"]

          def inspect():
              run = run_plan_command(REQUEST_URI)
              result = run_propose_axis_command(run.planning_run_id)
              u = result.editorial_understanding
              return {
                  "status": "SUCCESS",
                  "planning_run_id": str(run.planning_run_id),
                  "source_lineage_id": str(run.source_lineage_id),
                  "understanding_id": str(u.understanding_id),
                  "synthesis": u.synthesis,
                  "central_ideas": u.central_ideas,
                  "relations_and_tensions": u.relations_and_tensions,
                  "nuances": u.nuances,
                  "source_limits": u.source_limits,
                  "editorial_opportunities": u.editorial_opportunities,
                  "axis": result.proposed_axis,
              }

          class Handler(BaseHTTPRequestHandler):
              def _write(self, status, payload):
                  body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if not hmac.compare_digest(self.headers.get("X-Proof-Token", ""), PROOF_TOKEN):
                      self._write(403, {"error": "forbidden"})
                      return
                  if self.path == "/health":
                      self._write(200, {"status": "ok"})
                      return
                  if self.path != "/inspect":
                      self._write(404, {"error": "not_found"})
                      return
                  try:
                      self._write(200, inspect())
                  except Exception as exc:
                      self._write(500, {"error": type(exc).__name__, "message": str(exc)})

              def log_message(self, format, *args):
                  return

          ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8080"))), Handler).serve_forever()
          PY
          proof_b64="$(base64 -w0 /tmp/inspect_service.py)"
          gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet >/dev/null 2>&1 || true
          gcloud run deploy "${PROOF_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --image="${pinned_image}" \
            --service-account="${RUNTIME_SA}" --command=python \
            --args=-c,"import base64;import os;exec(base64.b64decode(os.environ['PROOF_SCRIPT_B64']))" \
            --cpu=2 --memory=4Gi --concurrency=1 --max-instances=1 --min-instances=0 --timeout=900 \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},HEFESTO_GCS_BUCKET=${BUCKET},PROOF_REQUEST_URI=${REQUEST_URI},PROOF_SCRIPT_B64=${proof_b64},PROOF_TOKEN=${proof_token}" \
            --quiet
          proof_url="$(gcloud run services describe "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')"
          echo "PROOF_URL=${proof_url}" >> "${GITHUB_ENV}"
          echo "PROOF_TOKEN=${proof_token}" >> "${GITHUB_ENV}"
      - name: Read persisted understanding and Axis
        run: |
          set -euo pipefail
          curl -fsS -H "X-Proof-Token: ${PROOF_TOKEN}" "${PROOF_URL}/inspect" | tee /tmp/result.json
          test "$(jq -r '.status' /tmp/result.json)" = "SUCCESS"
      - name: Cleanup
        if: always()
        run: gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet || true
