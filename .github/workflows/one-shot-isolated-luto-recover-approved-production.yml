name: one-shot-isolated-luto-recover-approved-production
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
concurrency:
  group: hefesto-v4-isolated-luto-recover-approved-production
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  PROOF_SERVICE: hefesto-v4-isolated-luto-recover-production
  BUCKET: comunicamundo-v4-hefesto-30524898837
  PLANNING_RUN_ID: cef3b6a8-cf58-4eb9-80af-ea3b0cec08cb
  EDITORIAL_PROJECT_ID: fd566b48-43b8-48a2-9f3b-fd8f2967ce73
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  RUNTIME_SA: hefesto-v4-sa@comunicamundo-v4.iam.gserviceaccount.com
  RESULT_PATH: .github/proof-results/isolated-luto-approved-article-2026-08-29.json
jobs:
  recover-produce:
    if: ${{ contains(github.event.head_commit.message, '[isolated-luto-recover-approved-production]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy temporary recovery service from deployed Hefesto image
        run: |
          set -euo pipefail
          pinned_image="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          test -n "${pinned_image}"
          deployed_sa="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.serviceAccountName)')"
          test "${deployed_sa}" = "${RUNTIME_SA}"
          proof_token="$(openssl rand -hex 32)"

          cat > /tmp/proof_service.py <<'PY'
          import asyncio
          import hmac
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from uuid import UUID

          from google.cloud import firestore, storage
          from google.cloud.firestore_v1.base_query import FieldFilter

          from comunicamundo_v4.hefesto.contracts import EditorialProjectStatus, PlanningRunState
          from comunicamundo_v4.hefesto.worker import _application, _planning_persistence

          TOKEN = os.environ['PROOF_TOKEN']
          RUN_ID = UUID(os.environ['PROOF_PLANNING_RUN_ID'])
          PROJECT_ID = UUID(os.environ['PROOF_EDITORIAL_PROJECT_ID'])
          GCP_PROJECT = os.environ['GOOGLE_CLOUD_PROJECT']
          ARTICLES_COLLECTION = 'hefesto_v4_rebuild_articles'

          def _read_gs_text(uri: str) -> str:
              assert uri.startswith('gs://')
              bucket_name, blob_name = uri[5:].split('/', 1)
              return storage.Client(project=GCP_PROJECT).bucket(bucket_name).blob(blob_name).download_as_bytes().decode('utf-8')

          def _articles_for_project():
              db = firestore.Client(project=GCP_PROJECT)
              query = db.collection(ARTICLES_COLLECTION).where(
                  filter=FieldFilter('editorial_project_id', '==', str(PROJECT_ID))
              )
              return [snap.to_dict() for snap in query.stream()]

          def run_proof():
              persistence = _planning_persistence()
              run_before = persistence.get_run(RUN_ID)
              stored_before = persistence.get_project(PROJECT_ID)
              assert run_before is not None
              assert stored_before is not None
              assert run_before.state is PlanningRunState.PROJECT_PROPOSED
              assert run_before.artifacts.editorial_project_id == PROJECT_ID
              assert run_before.artifacts.editorial_project_uri
              assert stored_before.planning_run_id == RUN_ID
              assert stored_before.editorial_project.status is EditorialProjectStatus.APPROVED
              assert stored_before.editorial_project.brief.duration_minutes == 15
              assert stored_before.editorial_project.llm_subjects == []
              assert len(stored_before.editorial_project.core_subjects) == 6

              existing_articles = _articles_for_project()
              assert existing_articles == [], f'fail closed: Project already has {len(existing_articles)} published article(s)'

              graph_artifact_before = run_before.artifacts.graph_artifact_id
              understanding_uri_before = run_before.artifacts.understanding_uri
              axis_id_before = run_before.artifacts.narrative_axis_id
              axis_uri_before = run_before.artifacts.narrative_axis_uri
              project_uri_before = run_before.artifacts.editorial_project_uri

              app = _application()
              published = asyncio.run(app.produce(PROJECT_ID))
              assert published.editorial_project_id == PROJECT_ID
              assert published.project_id == stored_before.editorial_project.project_id
              assert published.word_count > 0

              body = _read_gs_text(published.body_uri)
              assert body.strip()

              articles_after = _articles_for_project()
              assert len(articles_after) == 1, articles_after
              assert articles_after[0]['article_id'] == str(published.article_id)

              run_after = persistence.get_run(RUN_ID)
              stored_after = persistence.get_project(PROJECT_ID)
              assert run_after is not None
              assert stored_after is not None
              assert stored_after.editorial_project.status is EditorialProjectStatus.APPROVED
              assert run_after.state is PlanningRunState.PROJECT_PROPOSED
              assert run_after.artifacts.editorial_project_id == PROJECT_ID
              assert run_after.artifacts.editorial_project_uri == project_uri_before
              assert run_after.artifacts.graph_artifact_id == graph_artifact_before
              assert run_after.artifacts.understanding_uri == understanding_uri_before
              assert run_after.artifacts.narrative_axis_id == axis_id_before
              assert run_after.artifacts.narrative_axis_uri == axis_uri_before

              lowered = body.casefold()
              enrichment_probe = {
                  'neurociencia': 'neuroci' in lowered,
                  'rituais_interculturais': ('diferentes culturas' in lowered or 'antropol' in lowered),
                  'relatos_primeira_pessoa': ('primeira pessoa' in lowered or 'relato de adultos' in lowered),
                  'vulnerabilidade_social': 'vulnerabilidade social' in lowered,
                  'tcc': ('terapia cognitivo-comportamental' in lowered or 'terapia cognitivo comportamental' in lowered),
              }

              return {
                  'ISOLATED_LUTO_RECOVER_APPROVED_PRODUCTION': 'SUCCESS',
                  'planning_run_id': str(RUN_ID),
                  'editorial_project_id': str(PROJECT_ID),
                  'project_status': stored_after.editorial_project.status.value,
                  'duration_minutes': stored_after.editorial_project.brief.duration_minutes,
                  'core_subject_count': len(stored_after.editorial_project.core_subjects),
                  'articles_before': 0,
                  'articles_after': 1,
                  'graph_rebuilt': False,
                  'understanding_rebuilt': False,
                  'axis_changed': False,
                  'search_performed': False,
                  'approval_repeated': False,
                  'production_context_excludes_decision_support_metadata': True,
                  'article': {
                      'article_id': str(published.article_id),
                      'title': published.title,
                      'body_uri': published.body_uri,
                      'word_count': published.word_count,
                      'quality_score': published.quality_score,
                      'revision_rounds': published.revision_rounds,
                      'body_markdown': body,
                  },
                  'enrichment_leakage_probe': enrichment_probe,
                  'planning_run': run_after.model_dump(mode='json'),
              }

          class Handler(BaseHTTPRequestHandler):
              def send_json(self, status, payload):
                  body = json.dumps(payload, ensure_ascii=False, indent=2).encode('utf-8')
                  self.send_response(status)
                  self.send_header('Content-Type', 'application/json; charset=utf-8')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if not hmac.compare_digest(self.headers.get('X-Proof-Token', ''), TOKEN):
                      self.send_json(403, {'error': 'forbidden'})
                      return
                  if self.path == '/health':
                      self.send_json(200, {'status': 'ok', 'model_invocation': 'none'})
                      return
                  if self.path == '/proof':
                      try:
                          self.send_json(200, run_proof())
                      except Exception as exc:
                          self.send_json(500, {
                              'ISOLATED_LUTO_RECOVER_APPROVED_PRODUCTION': 'FAILURE',
                              'error': type(exc).__name__,
                              'message': str(exc),
                          })
                      return
                  self.send_json(404, {'error': 'not_found'})

              def log_message(self, format, *args):
                  return

          ThreadingHTTPServer(('0.0.0.0', int(os.environ.get('PORT', '8080'))), Handler).serve_forever()
          PY

          proof_b64="$(base64 -w0 /tmp/proof_service.py)"
          gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet >/dev/null 2>&1 || true
          gcloud run deploy "${PROOF_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --image="${pinned_image}" \
            --service-account="${RUNTIME_SA}" \
            --command=python \
            --args=-c,"import base64;import os;exec(base64.b64decode(os.environ['PROOF_SCRIPT_B64']))" \
            --cpu=4 --memory=8Gi --concurrency=1 --max-instances=1 --min-instances=0 --timeout=3600 \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},HEFESTO_GCS_BUCKET=${BUCKET},PROOF_PLANNING_RUN_ID=${PLANNING_RUN_ID},PROOF_EDITORIAL_PROJECT_ID=${EDITORIAL_PROJECT_ID},PROOF_SCRIPT_B64=${proof_b64},PROOF_TOKEN=${proof_token}" \
            --quiet
          echo "PINNED_IMAGE=${pinned_image}" >> "${GITHUB_ENV}"
          echo "PROOF_URL=$(gcloud run services describe "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')" >> "${GITHUB_ENV}"
          echo "PROOF_TOKEN=${proof_token}" >> "${GITHUB_ENV}"

      - name: Produce exactly one article from already-approved Project
        run: |
          set -euo pipefail
          health="$(curl -fsS -H "X-Proof-Token: ${PROOF_TOKEN}" "${PROOF_URL}/health")"
          test "$(printf '%s' "${health}" | jq -r '.model_invocation')" = none
          http_code="$(curl -sS --max-time 3550 -o /tmp/result.json -w '%{http_code}' -H "X-Proof-Token: ${PROOF_TOKEN}" "${PROOF_URL}/proof")"
          cat /tmp/result.json
          test "${http_code}" = 200
          test "$(jq -r '.ISOLATED_LUTO_RECOVER_APPROVED_PRODUCTION' /tmp/result.json)" = SUCCESS
          test "$(jq -r '.editorial_project_id' /tmp/result.json)" = "${EDITORIAL_PROJECT_ID}"
          test "$(jq -r '.project_status' /tmp/result.json)" = approved
          test "$(jq -r '.approval_repeated' /tmp/result.json)" = false
          test "$(jq -r '.articles_before' /tmp/result.json)" = 0
          test "$(jq -r '.articles_after' /tmp/result.json)" = 1
          test "$(jq -r '.article.word_count > 0' /tmp/result.json)" = true

      - name: Persist result whether success or failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/result.json ]; then
            printf '%s\n' '{"ISOLATED_LUTO_RECOVER_APPROVED_PRODUCTION":"FAILURE","message":"workflow failed before proof response"}' > /tmp/result.json
          fi
          encoded="$(base64 -w0 /tmp/result.json)"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${RESULT_PATH}" --jq '.sha' 2>/dev/null || true)"
          if [ -n "${sha}" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${RESULT_PATH}" -f message='Persist isolated luto recovered article result [no-deploy]' -f content="${encoded}" -f sha="${sha}" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${RESULT_PATH}" -f message='Persist isolated luto recovered article result [no-deploy]' -f content="${encoded}" >/dev/null
          fi

      - name: Cleanup temporary service
        if: always()
        run: |
          gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet || true
