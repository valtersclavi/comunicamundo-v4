name: one-shot-luto-direct-state
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
env:
  PROJECT_ID: comunicamundo-v4
  PROJECT_NUMBER: "30524898837"
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  TARGET_PROJECT_ID: 13101c35-723d-43fe-9b45-0082b49c0a76
jobs:
  read-state:
    if: ${{ contains(github.event.head_commit.message, '[luto-direct-state]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Grant deployer read-only Firestore access
        run: |
          set -euo pipefail
          gcloud projects add-iam-policy-binding "${PROJECT_ID}" \
            --member="serviceAccount:${DEPLOYER_SA}" \
            --role="roles/datastore.viewer" \
            --condition=None \
            --quiet >/dev/null
      - name: Read durable planning and lineage checkpoints directly
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          base="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents"
          curl -fsS -H "Authorization: Bearer ${token}" \
            "${base}/hefesto_v4_rebuild_planning_runs?pageSize=1000" > /tmp/runs.json
          curl -fsS -H "Authorization: Bearer ${token}" \
            "${base}/hefesto_v4_rebuild_source_lineages?pageSize=1000" > /tmp/lineages.json
          jq --arg pid "${TARGET_PROJECT_ID}" '
            [.documents[]? | select(.fields.project_id.stringValue == $pid) | {
              document: .name,
              planning_run_id: .fields.planning_run_id.stringValue,
              state: .fields.state.stringValue,
              error: (.fields.error.stringValue // null),
              source_lineage_id: .fields.source_lineage_id.stringValue,
              request_fingerprint: .fields.request_fingerprint.stringValue,
              understanding_uri: (.fields.artifacts.mapValue.fields.understanding_uri.stringValue // null),
              narrative_axis_uri: (.fields.artifacts.mapValue.fields.narrative_axis_uri.stringValue // null),
              updated_at: (.fields.updated_at.timestampValue // .updateTime)
            }] | sort_by(.updated_at) | reverse' /tmp/runs.json > /tmp/luto-runs.json
          jq --arg pid "${TARGET_PROJECT_ID}" '
            [.documents[]? | select(.fields.project_id.stringValue == $pid) | {
              document: .name,
              source_lineage_id: .fields.source_lineage_id.stringValue,
              state: .fields.state.stringValue,
              chunk_count: (.fields.chunk_count.integerValue // null),
              extracted_count: (.fields.extracted_count.integerValue // null),
              failed_count: (.fields.failed_count.integerValue // null),
              graph_extractions_manifest_uri: (.fields.graph_extractions_manifest_uri.stringValue // null),
              graph_manifest_uri: (.fields.graph_manifest_uri.stringValue // null),
              graph_artifact_id: (.fields.graph_artifact_id.stringValue // null),
              updated_at: (.fields.updated_at.timestampValue // .updateTime)
            }] | sort_by(.updated_at) | reverse' /tmp/lineages.json > /tmp/luto-lineages.json
          echo '=== PLANNING RUNS ==='
          cat /tmp/luto-runs.json
          echo '=== SOURCE LINEAGES ==='
          cat /tmp/luto-lineages.json
          test "$(jq 'length' /tmp/luto-runs.json)" -gt 0
          test "$(jq 'length' /tmp/luto-lineages.json)" -gt 0
      - name: Result
        if: always()
        run: |
          {
            echo '# Luto infantil — durable checkpoint state'
            if [ -f /tmp/luto-runs.json ]; then
              echo '## Planning runs'
              echo '```json'
              cat /tmp/luto-runs.json
              echo '```'
            fi
            if [ -f /tmp/luto-lineages.json ]; then
              echo '## Source lineages'
              echo '```json'
              cat /tmp/luto-lineages.json
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
