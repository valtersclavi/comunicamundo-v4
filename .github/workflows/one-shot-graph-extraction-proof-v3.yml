name: one-shot-graph-extraction-proof-v3
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hefesto-v4-one-shot-graph-extraction-proof-v3
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  PROOF_JOB: hefesto-v4-graph-proof
  BUCKET: comunicamundo-v4-hefesto-30524898837
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  RUNTIME_SA: hefesto-v4-sa@comunicamundo-v4.iam.gserviceaccount.com
jobs:
  prove-one-chunk:
    if: ${{ contains(github.event.head_commit.message, '[graph-extraction-proof-v3]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Prepare runtime proof job
        run: |
          set -euo pipefail
          pinned_image="$(gcloud run jobs describe "${JOB_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')"
          test -n "${pinned_image}"
          deployed_sa="$(gcloud run jobs describe "${JOB_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --format='value(spec.template.spec.template.spec.serviceAccountName)')"
          test "${deployed_sa}" = "${RUNTIME_SA}"
          cat > /tmp/proof.py <<'PY'
          import json
          import os
          from pathlib import Path
          from comunicamundo_v4.hefesto.contracts import PlanningRequest, SourceLineageState
          from comunicamundo_v4.hefesto.persistence import GcpEditorialPersistence, GcpPersistenceSettings
          from comunicamundo_v4.hefesto.worker import run_extract_graph_command, run_plan_command

          payload = {
              "project_id": "20260827-0000-4000-8000-000000000003",
              "brief": {
                  "theme": "Prova atomica real de extracao de grafo",
                  "approach": "Identificar apenas relacoes explicitas no texto",
                  "duration_minutes": 1,
                  "output_language": "pt-BR",
                  "product": "article",
              },
              "sources": [{
                  "source_id": "20260827-0000-4000-8000-000000000004",
                  "text": "Maria e mae de Joao. Maria acompanha Joao durante o luto. Joao percebe a ausencia do pai.",
                  "language": "pt-BR",
                  "title": "Prova atomica real",
                  "metadata": {"proof": "graph-extraction-one-chunk-v3"},
              }],
          }
          request = PlanningRequest.model_validate(payload)
          request_path = Path("/tmp/graph-proof-request.json")
          request_path.write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")

          run = run_plan_command(str(request_path))
          persistence = GcpEditorialPersistence.from_settings(
              GcpPersistenceSettings(
                  project=os.environ["GOOGLE_CLOUD_PROJECT"],
                  bucket=os.environ["HEFESTO_GCS_BUCKET"],
              )
          )
          before = persistence.get_source_lineage(run.source_lineage_id)
          assert before is not None
          assert before.state is SourceLineageState.CHUNKS_READY, before
          assert before.chunk_count == 1, before
          assert before.graph_extractions_manifest_uri is None, before

          result = run_extract_graph_command(run.source_lineage_id)
          assert result.state is SourceLineageState.GRAPH_EXTRACTIONS_READY, result
          assert result.chunk_count == 1, result
          assert result.extracted_count == 1, result
          assert result.failed_count == 0, result
          assert result.graph_extractions_manifest_uri, result

          manifest = persistence.load_graph_extraction_manifest(result.graph_extractions_manifest_uri)
          assert manifest.chunk_count == 1, manifest
          assert manifest.extracted_count == 1, manifest
          assert manifest.failed_count == 0, manifest
          assert len(manifest.entries) == 1, manifest
          entry = manifest.entries[0]
          assert entry.status.value == "extracted", entry
          assert entry.extraction_uri, entry

          extraction = persistence.load_graph_extraction(entry.extraction_uri)
          assert extraction.source_lineage_id == run.source_lineage_id, extraction
          assert extraction.source_id == request.sources[0].source_id, extraction
          assert extraction.chunk_id == entry.chunk_id, extraction
          assert extraction.chunk_sha256 == entry.content_sha256, extraction
          assert extraction.contract_version == "graph-extraction.v1", extraction
          assert extraction.extractor_version == "hefesto.simple-llm-path.v1", extraction
          assert extraction.model == "gemini-2.5-flash", extraction
          assert len(extraction.entities) >= 1, extraction
          assert len(extraction.relations) >= 1, extraction

          print(json.dumps({
              "GRAPH_EXTRACTION_PROOF": "SUCCESS",
              "planning_run_id": str(run.planning_run_id),
              "source_lineage_id": str(run.source_lineage_id),
              "entities": len(extraction.entities),
              "relations": len(extraction.relations),
              "manifest_uri": result.graph_extractions_manifest_uri,
              "extraction_uri": entry.extraction_uri,
          }, ensure_ascii=False))
          PY
          proof_b64="$(base64 -w0 /tmp/proof.py)"
          gcloud run jobs delete "${PROOF_JOB}" --project="${PROJECT_ID}" --region="${REGION}" --quiet >/dev/null 2>&1 || true
          gcloud run jobs create "${PROOF_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${pinned_image}" \
            --service-account="${RUNTIME_SA}" \
            --command=python \
            --args=-c,"import base64;import os;exec(base64.b64decode(os.environ['PROOF_SCRIPT_B64']))" \
            --cpu=4 \
            --memory=8Gi \
            --task-timeout=600s \
            --max-retries=0 \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},HEFESTO_GCS_BUCKET=${BUCKET},PROOF_SCRIPT_B64=${proof_b64}" \
            --quiet
          echo "PINNED_IMAGE=${pinned_image}" >> "${GITHUB_ENV}"
      - name: Execute one-chunk real proof
        run: |
          set -euo pipefail
          execution="$(gcloud run jobs execute "${PROOF_JOB}" \
            --project="${PROJECT_ID}" --region="${REGION}" --wait \
            --format='value(metadata.name)')"
          test -n "${execution}"
          echo "PROOF_EXECUTION=${execution}" >> "${GITHUB_ENV}"
          state="$(gcloud run jobs executions describe "${execution}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --format='value(status.conditions[0].state)')"
          test "${state}" = "CONDITION_SUCCEEDED" || test "${state}" = "True" || true
      - name: Verify execution succeeded
        run: |
          set -euo pipefail
          completed="$(gcloud run jobs executions describe "${PROOF_EXECUTION}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --format='value(status.succeededCount)')"
          failed="$(gcloud run jobs executions describe "${PROOF_EXECUTION}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --format='value(status.failedCount)')"
          test "${completed}" = "1"
          test -z "${failed}" || test "${failed}" = "0"
      - name: Result
        if: always()
        run: |
          {
            echo '# One-chunk real graph extraction proof v3'
            echo "- Canonical image: \`${PINNED_IMAGE:-NOT_RESOLVED}\`"
            echo "- Temporary proof job: \`${PROOF_JOB}\`"
            echo "- Execution: \`${PROOF_EXECUTION:-NOT_RUN}\`"
            echo '- Runtime identity: `hefesto-v4-sa@comunicamundo-v4.iam.gserviceaccount.com`'
            echo '- Expected paid graph calls on first successful run: exactly 1'
            echo '- Canonical job changed: no'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Cleanup temporary proof job
        if: always()
        run: |
          gcloud run jobs delete "${PROOF_JOB}" --project="${PROJECT_ID}" --region="${REGION}" --quiet || true
