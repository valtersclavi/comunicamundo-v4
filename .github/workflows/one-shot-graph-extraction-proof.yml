name: one-shot-graph-extraction-proof
on:
  push:
    branches:
      - main
permissions:
  contents: read
  id-token: write
concurrency:
  group: hefesto-v4-one-shot-graph-extraction-proof
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  BUCKET: comunicamundo-v4-hefesto-30524898837
  REQUEST_URI: gs://comunicamundo-v4-hefesto-30524898837/proofs/graph-extraction-one-chunk/request.json
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
jobs:
  prove-one-chunk:
    if: ${{ contains(github.event.head_commit.message, '[graph-extraction-proof]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.14"
      - name: Install proof reader
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -e .
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Prepare exactly one persisted chunk
        run: |
          set -euo pipefail
          cat > request.json <<'JSON'
          {
            "project_id": "20260827-0000-4000-8000-000000000001",
            "brief": {
              "theme": "Prova atomica de extracao de grafo",
              "approach": "Identificar apenas relacoes explicitas no texto",
              "duration_minutes": 1,
              "output_language": "pt-BR",
              "product": "article"
            },
            "sources": [
              {
                "source_id": "20260827-0000-4000-8000-000000000002",
                "text": "Maria e mae de Joao. Maria acompanha Joao durante o luto. Joao percebe a ausencia do pai.",
                "language": "pt-BR",
                "title": "Prova atomica",
                "metadata": {"proof": "graph-extraction-one-chunk"}
              }
            ]
          }
          JSON
          python - <<'PY'
          import json
          from comunicamundo_v4.hefesto.contracts import PlanningRequest
          from comunicamundo_v4.hefesto.planning import prepare_source_chunks
          request = PlanningRequest.model_validate(json.load(open("request.json", encoding="utf-8")))
          chunks = prepare_source_chunks(request.sources)
          assert len(chunks) == 1, f"expected exactly one chunk, got {len(chunks)}"
          print(f"LOCAL_PROOF_CHUNKS={len(chunks)}")
          PY
          gcloud storage cp request.json "${REQUEST_URI}" --quiet
          execution="$(gcloud run jobs execute "${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --args="plan,--request,${REQUEST_URI}" \
            --wait \
            --format='value(metadata.name)')"
          test -n "${execution}"
          echo "PLAN_EXECUTION=${execution}" >> "${GITHUB_ENV}"
      - name: Resolve the persisted SourceLineage
        id: lineage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from google.cloud import firestore
          from comunicamundo_v4.hefesto.contracts import PlanningRequest
          from comunicamundo_v4.hefesto.persistence import source_lineage_lookup_id
          from comunicamundo_v4.hefesto.planning import fingerprint_sources

          request = PlanningRequest.model_validate(json.load(open("request.json", encoding="utf-8")))
          source_fingerprint = fingerprint_sources(request.sources)
          lookup_id = source_lineage_lookup_id(request.project_id, source_fingerprint)
          db = firestore.Client(project=os.environ["PROJECT_ID"])
          key = db.collection("hefesto_v4_rebuild_source_lineage_keys").document(lookup_id).get()
          assert key.exists, "source lineage key was not persisted"
          key_data = key.to_dict()
          source_lineage_id = key_data["source_lineage_id"]
          lineage = db.collection("hefesto_v4_rebuild_source_lineages").document(source_lineage_id).get()
          assert lineage.exists, "source lineage document was not persisted"
          data = lineage.to_dict()
          assert data.get("chunk_count") == 1, data
          assert data.get("chunk_manifest_uri"), data
          print(f"SOURCE_LINEAGE_ID={source_lineage_id}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"source_lineage_id={source_lineage_id}\n")
          PY
      - name: Run exactly one real graph extraction
        env:
          SOURCE_LINEAGE_ID: ${{ steps.lineage.outputs.source_lineage_id }}
        run: |
          set -euo pipefail
          test -n "${SOURCE_LINEAGE_ID}"
          execution="$(gcloud run jobs execute "${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --args="extract-graph,--source-lineage-id,${SOURCE_LINEAGE_ID}" \
            --wait \
            --format='value(metadata.name)')"
          test -n "${execution}"
          echo "EXTRACT_EXECUTION=${execution}" >> "${GITHUB_ENV}"
      - name: Validate durable graph extraction
        env:
          SOURCE_LINEAGE_ID: ${{ steps.lineage.outputs.source_lineage_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from google.cloud import firestore, storage

          project = os.environ["PROJECT_ID"]
          source_lineage_id = os.environ["SOURCE_LINEAGE_ID"]
          db = firestore.Client(project=project)
          snap = db.collection("hefesto_v4_rebuild_source_lineages").document(source_lineage_id).get()
          assert snap.exists, "missing SourceLineage after extraction"
          lineage = snap.to_dict()
          assert lineage.get("state") == "graph_extractions_ready", lineage
          assert lineage.get("chunk_count") == 1, lineage
          assert lineage.get("extracted_count") == 1, lineage
          assert lineage.get("failed_count") == 0, lineage
          manifest_uri = lineage.get("graph_extractions_manifest_uri")
          assert manifest_uri, lineage

          client = storage.Client(project=project)
          def load_gs_json(uri: str):
              assert uri.startswith("gs://"), uri
              bucket_name, object_name = uri[5:].split("/", 1)
              return json.loads(client.bucket(bucket_name).blob(object_name).download_as_bytes().decode("utf-8"))

          manifest = load_gs_json(manifest_uri)
          assert manifest["chunk_count"] == 1, manifest
          assert manifest["extracted_count"] == 1, manifest
          assert manifest["failed_count"] == 0, manifest
          assert len(manifest["entries"]) == 1, manifest
          entry = manifest["entries"][0]
          assert entry["status"] == "extracted", entry
          assert entry.get("extraction_uri"), entry

          extraction = load_gs_json(entry["extraction_uri"])
          assert extraction["source_lineage_id"] == source_lineage_id, extraction
          assert extraction["source_id"] == entry["source_id"], extraction
          assert extraction["chunk_id"] == entry["chunk_id"], extraction
          assert extraction["chunk_sha256"] == entry["content_sha256"], extraction
          assert extraction["contract_version"] == "graph-extraction.v1", extraction
          assert extraction["extractor_version"] == "hefesto.simple-llm-path.v1", extraction
          assert extraction["model"] == "gemini-2.5-flash", extraction
          assert len(extraction["entities"]) >= 1, extraction
          assert len(extraction["relations"]) >= 1, extraction
          print(json.dumps({
              "GRAPH_EXTRACTION_PROOF": "SUCCESS",
              "source_lineage_id": source_lineage_id,
              "entities": len(extraction["entities"]),
              "relations": len(extraction["relations"]),
              "manifest_uri": manifest_uri,
              "extraction_uri": entry["extraction_uri"],
          }, ensure_ascii=False))
          PY
      - name: Result
        if: always()
        run: |
          {
            echo "# One-chunk graph extraction proof"
            echo "- Plan execution: \`${PLAN_EXECUTION:-NOT_RUN}\`"
            echo "- Extract execution: \`${EXTRACT_EXECUTION:-NOT_RUN}\`"
            echo "- SourceLineage: \`${{ steps.lineage.outputs.source_lineage_id || 'NOT_RESOLVED' }}\`"
            echo "- Intended paid graph calls: at most 1 (one persisted chunk)"
          } >> "${GITHUB_STEP_SUMMARY}"
