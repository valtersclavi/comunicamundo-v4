name: one-shot-inspect-fresh-luto-axis-chain
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
concurrency:
  group: hefesto-v4-inspect-fresh-luto-axis-chain
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  PROOF_SERVICE: hefesto-v4-inspect-fresh-luto-axis-chain
  BUCKET: comunicamundo-v4-hefesto-30524898837
  PLANNING_RUN_ID: 94d992ae-40fe-4913-8a1a-2052984dd23d
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  RUNTIME_SA: hefesto-v4-sa@comunicamundo-v4.iam.gserviceaccount.com
  RESULT_PATH: .github/proof-results/fresh-luto-axis-chain-2026-08-29.json
jobs:
  inspect:
    if: ${{ contains(github.event.head_commit.message, '[inspect-fresh-luto-axis-chain]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy read-only inspector
        run: |
          set -euo pipefail
          pinned_image="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          test -n "${pinned_image}"
          proof_token="$(openssl rand -hex 32)"
          cat > /tmp/inspect_service.py <<'PY'
          import hmac
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from uuid import UUID

          from comunicamundo_v4.hefesto.persistence import GcpEditorialPersistence, GcpPersistenceSettings

          TOKEN = os.environ['PROOF_TOKEN']
          RUN_ID = UUID(os.environ['PROOF_PLANNING_RUN_ID'])

          def inspect():
              p = GcpEditorialPersistence.from_settings(
                  GcpPersistenceSettings(
                      project=os.environ['GOOGLE_CLOUD_PROJECT'],
                      bucket=os.environ['HEFESTO_GCS_BUCKET'],
                  )
              )
              run = p.repository.get_planning_run(RUN_ID)
              if run is None:
                  raise ValueError('PlanningRun not found')
              axis = None
              if run.artifacts.narrative_axis_uri:
                  axis = p.load_narrative_axis(run.artifacts.narrative_axis_uri).narrative_axis
              decisions = []
              uri = run.artifacts.axis_feedback_decision_uri
              seen = set()
              while uri:
                  if uri in seen:
                      raise ValueError('feedback decision chain cycle')
                  seen.add(uri)
                  d = p.load_axis_feedback_decision(uri)
                  decisions.append(d.model_dump(mode='json'))
                  uri = d.previous_feedback_decision_uri
              return {
                  'planning_run_id': str(run.planning_run_id),
                  'run_state': run.state.value,
                  'current_narrative_axis_uri': run.artifacts.narrative_axis_uri,
                  'current_axis': None if axis is None else axis.model_dump(mode='json'),
                  'current_feedback_decision_uri': run.artifacts.axis_feedback_decision_uri,
                  'feedback_chain_newest_first': decisions,
              }

          class Handler(BaseHTTPRequestHandler):
              def send_json(self, status, payload):
                  body = json.dumps(payload, ensure_ascii=False, indent=2).encode('utf-8')
                  self.send_response(status)
                  self.send_header('Content-Type', 'application/json; charset=utf-8')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_GET(self):
                  if not hmac.compare_digest(self.headers.get('X-Proof-Token', ''), TOKEN):
                      self.send_json(403, {'error':'forbidden'}); return
                  if self.path == '/health':
                      self.send_json(200, {'status':'ok','model_invocation':'none'}); return
                  if self.path == '/inspect':
                      try:
                          self.send_json(200, inspect())
                      except Exception as exc:
                          self.send_json(500, {'error':type(exc).__name__,'message':str(exc)})
                      return
                  self.send_json(404, {'error':'not_found'})
              def log_message(self, format, *args):
                  return

          ThreadingHTTPServer(('0.0.0.0', int(os.environ.get('PORT','8080'))), Handler).serve_forever()
          PY
          proof_b64="$(base64 -w0 /tmp/inspect_service.py)"
          gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet >/dev/null 2>&1 || true
          gcloud run deploy "${PROOF_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --image="${pinned_image}" \
            --service-account="${RUNTIME_SA}" \
            --command=python \
            --args=-c,"import base64;import os;exec(base64.b64decode(os.environ['PROOF_SCRIPT_B64']))" \
            --cpu=2 --memory=4Gi --concurrency=1 --max-instances=1 --min-instances=0 --timeout=900 \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},HEFESTO_GCS_BUCKET=${BUCKET},PROOF_PLANNING_RUN_ID=${PLANNING_RUN_ID},PROOF_SCRIPT_B64=${proof_b64},PROOF_TOKEN=${proof_token}" \
            --quiet
          proof_url="$(gcloud run services describe "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')"
          echo "PROOF_URL=${proof_url}" >> "${GITHUB_ENV}"
          echo "PROOF_TOKEN=${proof_token}" >> "${GITHUB_ENV}"

      - name: Read durable chain without model call
        run: |
          set -euo pipefail
          health="$(curl -fsS -H "X-Proof-Token: ${PROOF_TOKEN}" "${PROOF_URL}/health")"
          test "$(printf '%s' "${health}" | jq -r '.model_invocation')" = none
          curl -fsS -H "X-Proof-Token: ${PROOF_TOKEN}" "${PROOF_URL}/inspect" | tee /tmp/result.json
          jq -e '.planning_run_id == env.PLANNING_RUN_ID' /tmp/result.json >/dev/null

      - name: Persist inspection result to repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encoded="$(base64 -w0 /tmp/result.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${RESULT_PATH}" \
            -f message='Persist fresh luto Axis chain inspection [no-deploy]' \
            -f content="${encoded}" >/dev/null

      - name: Cleanup inspector service
        if: always()
        run: |
          gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet || true
