name: remove-practical-dimension
on:
  push:
    branches:
      - fix/remove-practical-dimension-clean-proof
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[genericity-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/remove-practical-dimension-clean-proof
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.14"
      - name: Remove dedicated praxis ontology
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          contracts = Path('src/comunicamundo_v4/hefesto/contracts.py')
          text = contracts.read_text()
          old = text
          text = text.replace('    practical_dimension: str | None = Field(default=None, min_length=1)\n', '')
          if text == old:
              raise SystemExit('contracts.py: dedicated field not found')
          contracts.write_text(text)

          prompts = Path('src/comunicamundo_v4/hefesto/prompts.py')
          text = prompts.read_text()
          replacements = {
              'Identify central ideas, mechanisms, tensions, concrete examples, practical implications, missing context, and relationships between ideas that matter for the requested product.':
                  'Identify central ideas, mechanisms, tensions, concrete examples, implications, missing context, and relationships between ideas that matter for the requested product.',
              'Return concrete source-grounded context, tensions, examples and practical implications. Do not write the final article.':
                  'Return concrete source-grounded context, tensions, examples and implications. Do not write the final article.',
              'Where the subject calls for how-to or operational practice, include a real practical_dimension. Treatment scale guides development, not section count.':
                  'Treatment scale guides development, not section count. Subject selection and development must follow the brief, approved Narrative Axis, source understanding, and editorial judgment rather than a fixed content checklist.',
              '2) core_subjects: the subjects the piece should actually develop, prioritizing what is supported by the sources and including operational/practical development where the topic calls for "how";':
                  '2) core_subjects: the subjects the piece should actually develop to fulfill the brief under the approved Narrative Axis, prioritizing what is supported by the sources;',
              'Each core subject needs only a title, a compact description of what must be developed, and an optional practical_dimension. Do not turn subjects into sections, scene-by-scene instructions, or prose paragraphs of the final article.':
                  'Each core subject needs only a title and a compact description of what must be developed. Do not turn subjects into sections, scene-by-scene instructions, or prose paragraphs of the final article.',
              'Practical dimension: {practical_dimension}\n': '',
              'Preserve nuance, specificity and practical usefulness.':
                  'Preserve nuance, specificity and usefulness for the intended audience.',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f'prompts.py expected text not found: {before[:80]}')
              text = text.replace(before, after)
          prompts.write_text(text)

          production = Path('src/comunicamundo_v4/hefesto/production.py')
          text = production.read_text()
          needle = '            practical_dimension=subject.practical_dimension or "none specified",\n'
          if needle not in text:
              raise SystemExit('production.py expected dedicated argument not found')
          production.write_text(text.replace(needle, ''))

          project_tests = Path('tests/test_editorial_project.py')
          text = project_tests.read_text()
          text = re.sub(
              r'def _proposal\(\*, practical: str \| None = "Como tornar a presença praticável no cotidiano\."\) -> EditorialProjectProposal:',
              'def _proposal() -> EditorialProjectProposal:',
              text,
          )
          text = re.sub(r'\n\s*practical_dimension=practical,', '', text)
          text = re.sub(
              r'\ndef test_practical_dimension_is_preserved\(\) -> None:\n.*?(?=\ndef test_human_gate_remains_and_no_article_is_produced\(\) -> None:)',
              '\n',
              text,
              flags=re.S,
          )
          text = re.sub(r'_proposal\(practical="[^"]*"\)', '_proposal()', text)
          text = '\n'.join(line for line in text.splitlines() if 'practical_dimension' not in line) + '\n'
          project_tests.write_text(text)

          worker_tests = Path('tests/test_worker.py')
          text = worker_tests.read_text()
          text = re.sub(r'\n\s*practical_dimension="[^"]*",', '', text)
          text = re.sub(r'\n\s*assert result\.editorial_project\.core_subjects\[0\]\.practical_dimension is not None', '', text)
          worker_tests.write_text(text)

          editorial_tests = Path('tests/test_editorial.py')
          text = editorial_tests.read_text()
          text = text.replace(
              'core_subjects=[EditorialSubjectProposal(title="A experiência infantil", development="Como a criança compreende e expressa a perda.", practical_dimension="Como conversar sem esconder nem sobrecarregar.")],',
              'core_subjects=[EditorialSubjectProposal(title="A experiência infantil", development="Como a criança compreende e expressa a perda e como conversar sem esconder nem sobrecarregar.")],'
          )
          text = re.sub(r'\n\s*assert project\.core_subjects\[0\]\.practical_dimension is not None', '', text)
          editorial_tests.write_text(text)

          leftovers = []
          for root in (Path('src'), Path('tests')):
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.py', '.md', '.json', '.yaml', '.yml'}:
                      if 'practical_dimension' in path.read_text(errors='ignore'):
                          leftovers.append(str(path))
          if leftovers:
              raise SystemExit('dedicated field still present in: ' + ', '.join(leftovers))
          PY
      - name: Prove package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -e '.[dev]'
          python -m pip check
          pytest
          python -m compileall -q src tests
          python -m comunicamundo_v4.hefesto.worker --help
      - name: Show remaining practical wording
        run: |
          set -euo pipefail
          grep -Rni --include='*.py' 'practic' src/comunicamundo_v4/hefesto || true
      - name: Commit validated cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          test -n "$(git status --porcelain)"
          git commit -m "Remove dedicated practical dimension from generic editorial contract [genericity-patched]"
          git push origin HEAD:fix/remove-practical-dimension-clean-proof
