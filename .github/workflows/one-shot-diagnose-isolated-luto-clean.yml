name: one-shot-diagnose-isolated-luto-clean
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  PROOF_SERVICE: hefesto-v4-isolated-luto-axis-feedback-clean
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  RESULT_PATH: .github/proof-results/isolated-luto-clean-diagnostics-2026-08-29.json
jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, '[diagnose-isolated-luto-clean]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Capture service state and logs
        run: |
          set +e
          service_json="$(gcloud run services describe "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json 2>&1)"
          service_rc=$?
          logs_json="$(gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=${PROOF_SERVICE}" --project="${PROJECT_ID}" --freshness=30m --limit=100 --order=asc --format=json 2>&1)"
          logs_rc=$?
          jq -n \
            --argjson service_rc "${service_rc}" \
            --arg service "${service_json}" \
            --argjson logs_rc "${logs_rc}" \
            --arg logs "${logs_json}" \
            '{service_rc:$service_rc,service:$service,logs_rc:$logs_rc,logs:$logs}' > /tmp/result.json
      - name: Persist diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/result.json ]; then printf '%s\n' '{"diagnostics_failed_before_result":true}' > /tmp/result.json; fi
          encoded="$(base64 -w0 /tmp/result.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${RESULT_PATH}" -f message='Persist isolated luto clean diagnostics [no-deploy]' -f content="${encoded}" >/dev/null
