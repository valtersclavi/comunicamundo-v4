name: one-shot-fresh-luto-axis-feedback-v2
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hefesto-v4-fresh-luto-axis-feedback-v2
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  PROOF_SERVICE: hefesto-v4-fresh-luto-axis-feedback-v2
  BUCKET: comunicamundo-v4-hefesto-30524898837
  PLANNING_RUN_ID: 94d992ae-40fe-4913-8a1a-2052984dd23d
  SOURCE_LINEAGE_ID: 2f43f316-f0ab-4970-be65-fb62dbfe5a8b
  EXPECTED_UNDERSTANDING_ID: 3c3ae7cf-8da3-41c1-bf58-cf3ec29d7705
  CURRENT_AXIS_ID: aa70d5d0-d04e-491c-890e-f06e1566148b
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  RUNTIME_SA: hefesto-v4-sa@comunicamundo-v4.iam.gserviceaccount.com
jobs:
  react-to-feedback:
    if: ${{ contains(github.event.head_commit.message, '[fresh-luto-axis-feedback-v2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Prepare temporary proof service
        run: |
          set -euo pipefail
          pinned_image="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          test -n "${pinned_image}"
          deployed_sa="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.serviceAccountName)')"
          test "${deployed_sa}" = "${RUNTIME_SA}"
          proof_token="$(openssl rand -hex 32)"

          cat > /tmp/proof_service.py <<'PY'
          import hmac
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from uuid import UUID

          from comunicamundo_v4.hefesto.contracts import NarrativeAxisStatus, PlanningRunState
          from comunicamundo_v4.hefesto.worker import run_review_axis_feedback_command

          PLANNING_RUN_ID = UUID(os.environ['PROOF_PLANNING_RUN_ID'])
          EXPECTED_SOURCE_LINEAGE_ID = os.environ['PROOF_SOURCE_LINEAGE_ID']
          EXPECTED_UNDERSTANDING_ID = os.environ['PROOF_UNDERSTANDING_ID']
          CURRENT_AXIS_ID = os.environ['PROOF_CURRENT_AXIS_ID']
          PROOF_TOKEN = os.environ['PROOF_TOKEN']
          FEEDBACK = (
              'Falta um foco mais forte no luto infantil em si. '
              'Também ficou de fora que o adulto responsável pela criança pode estar vivendo '
              'a própria confusão e o próprio luto. No geral, porém, a compreensão está boa.'
          )

          def run_proof():
              stage = 'review_axis_feedback'
              try:
                  result = run_review_axis_feedback_command(PLANNING_RUN_ID, FEEDBACK)
                  decision = result.decision
                  carry = decision.carry_forward

                  assert result.planning_run.planning_run_id == PLANNING_RUN_ID, result
                  assert str(result.planning_run.source_lineage_id) == EXPECTED_SOURCE_LINEAGE_ID, result
                  assert str(result.editorial_understanding.understanding_id) == EXPECTED_UNDERSTANDING_ID, result
                  assert result.planning_run.state is PlanningRunState.AXIS_PROPOSED, result
                  assert result.narrative_axis.status is NarrativeAxisStatus.PROPOSED, result
                  assert result.human_approval_required is True, result
                  assert result.search_performed is False, result
                  assert result.editorial_project_created is False, result

                  return {
                      'FRESH_LUTO_AXIS_FEEDBACK_V2': 'SUCCESS',
                      'feedback': FEEDBACK,
                      'planning_run_id': str(result.planning_run.planning_run_id),
                      'source_lineage_id': str(result.planning_run.source_lineage_id),
                      'understanding_id': str(result.editorial_understanding.understanding_id),
                      'previous_axis_id': CURRENT_AXIS_ID,
                      'result_axis_id': str(result.narrative_axis.narrative_axis_id),
                      'result_axis': result.narrative_axis.statement,
                      'axis_status': result.narrative_axis.status.value,
                      'decision_id': str(decision.feedback_decision_id),
                      'decision_state': decision.state.value,
                      'impact': decision.impact.value,
                      'affected_premises': decision.affected_premises,
                      'editorial_consequences': decision.editorial_consequences,
                      'impact_rationale': decision.impact_rationale,
                      'support': decision.support.value,
                      'support_rationale': decision.support_rationale,
                      'axis_action': decision.axis_action.value,
                      'treatment_scale': decision.treatment_scale.value,
                      'treatment_rationale': decision.treatment_rationale,
                      'enrichment_need': decision.enrichment_need,
                      'decision_rationale': decision.decision_rationale,
                      'carry_forward': None if carry is None else {
                          'intent': carry.intent,
                          'treatment_scale': carry.treatment_scale.value,
                          'rationale': carry.rationale,
                      },
                      'resulting_narrative_axis_id': None if decision.resulting_narrative_axis_id is None else str(decision.resulting_narrative_axis_id),
                      'human_approval_required': result.human_approval_required,
                      'search_performed': result.search_performed,
                      'editorial_project_created': result.editorial_project_created,
                      'research_needed': result.research_needed,
                      'stopped_at': result.stopped_at,
                  }
              except Exception as exc:
                  return {
                      'FRESH_LUTO_AXIS_FEEDBACK_V2': 'FAILURE',
                      'failed_stage': stage,
                      'feedback': FEEDBACK,
                      'error': type(exc).__name__,
                      'message': str(exc),
                  }

          class Handler(BaseHTTPRequestHandler):
              def write_json(self, status, payload):
                  body = json.dumps(payload, ensure_ascii=False).encode('utf-8')
                  self.send_response(status)
                  self.send_header('Content-Type', 'application/json; charset=utf-8')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def authorized(self):
                  return hmac.compare_digest(self.headers.get('X-Proof-Token', ''), PROOF_TOKEN)

              def do_GET(self):
                  if not self.authorized():
                      self.write_json(403, {'error': 'forbidden'})
                      return
                  if self.path == '/health':
                      self.write_json(200, {'status': 'ok', 'model_invocation': 'none'})
                      return
                  if self.path == '/proof':
                      self.write_json(200, run_proof())
                      return
                  self.write_json(404, {'error': 'not_found'})

              def log_message(self, format, *args):
                  return

          ThreadingHTTPServer(('0.0.0.0', int(os.environ.get('PORT', '8080'))), Handler).serve_forever()
          PY

          proof_b64="$(base64 -w0 /tmp/proof_service.py)"
          gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet >/dev/null 2>&1 || true
          gcloud run deploy "${PROOF_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --image="${pinned_image}" \
            --service-account="${RUNTIME_SA}" \
            --command=python \
            --args=-c,"import base64;import os;exec(base64.b64decode(os.environ['PROOF_SCRIPT_B64']))" \
            --cpu=4 --memory=8Gi --concurrency=1 --max-instances=1 --min-instances=0 --timeout=3600 \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},HEFESTO_GCS_BUCKET=${BUCKET},PROOF_PLANNING_RUN_ID=${PLANNING_RUN_ID},PROOF_SOURCE_LINEAGE_ID=${SOURCE_LINEAGE_ID},PROOF_UNDERSTANDING_ID=${EXPECTED_UNDERSTANDING_ID},PROOF_CURRENT_AXIS_ID=${CURRENT_AXIS_ID},PROOF_SCRIPT_B64=${proof_b64},PROOF_TOKEN=${proof_token}" \
            --quiet
          proof_url="$(gcloud run services describe "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')"
          test -n "${proof_url}"
          echo "PINNED_IMAGE=${pinned_image}" >> "${GITHUB_ENV}"
          echo "PROOF_URL=${proof_url}" >> "${GITHUB_ENV}"
          echo "PROOF_TOKEN=${proof_token}" >> "${GITHUB_ENV}"

      - name: Prove transport without model call
        run: |
          set -euo pipefail
          health="$(curl -fsS -H "X-Proof-Token: ${PROOF_TOKEN}" "${PROOF_URL}/health")"
          test "$(printf '%s' "${health}" | jq -r '.status')" = ok
          test "$(printf '%s' "${health}" | jq -r '.model_invocation')" = none

      - name: Send natural-language Axis correction and capture reaction
        run: |
          set -euo pipefail
          curl -fsS --max-time 3550 -H "X-Proof-Token: ${PROOF_TOKEN}" "${PROOF_URL}/proof" | tee /tmp/result.json
          status="$(jq -r '.FRESH_LUTO_AXIS_FEEDBACK_V2' /tmp/result.json)"
          if [ "${status}" = FAILURE ]; then
            echo "FAILED_STAGE=$(jq -r '.failed_stage' /tmp/result.json)" >> "${GITHUB_ENV}"
            echo "FAILED_ERROR=$(jq -r '.error' /tmp/result.json)" >> "${GITHUB_ENV}"
            echo "FAILED_MESSAGE=$(jq -r '.message' /tmp/result.json)" >> "${GITHUB_ENV}"
            exit 1
          fi
          test "${status}" = SUCCESS
          test "$(jq -r '.search_performed' /tmp/result.json)" = false
          test "$(jq -r '.editorial_project_created' /tmp/result.json)" = false
          test "$(jq -r '.human_approval_required' /tmp/result.json)" = true

      - name: Result
        if: always()
        run: |
          {
            echo '# Fresh luto Axis feedback v2 — reaction only'
            echo "- Planning run: \`${PLANNING_RUN_ID}\`"
            echo "- Source lineage: \`${SOURCE_LINEAGE_ID}\`"
            echo "- Understanding: \`${EXPECTED_UNDERSTANDING_ID}\`"
            echo "- Axis before feedback: \`${CURRENT_AXIS_ID}\`"
            if [ -n "${FAILED_STAGE:-}" ]; then
              echo "- Failed stage: \`${FAILED_STAGE}\` — \`${FAILED_ERROR}\`: ${FAILED_MESSAGE}"
            fi
            if [ -f /tmp/result.json ]; then
              echo ''
              echo '## Full reaction'
              echo '```json'
              cat /tmp/result.json
              echo ''
              echo '```'
            fi
            echo ''
            echo '- STOP: no automatic approval, no search, no Editorial Project.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Cleanup temporary service
        if: always()
        run: |
          gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet || true
