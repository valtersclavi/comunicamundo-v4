name: one-shot-social-media-multisource-ab

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: hefesto-v4-relational-proof
  cancel-in-progress: false

env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  RUNTIME_SA: hefesto-v4-sa@comunicamundo-v4.iam.gserviceaccount.com
  # Admission budget, not a content limit. Calls retain contract-specific budgets.
  ADMISSION_TPM: "2000000"
  MAX_CONCURRENCY: "8"
  PROJECT_CONCURRENCY: "6"

jobs:
  inspect-execution:
    if: contains(github.event.head_commit.message, '[inspect-execution=')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read one failed execution without rerunning it
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "${COMMIT_MESSAGE}" =~ \[inspect-execution=([a-z0-9-]+)\] ]]; then
            execution="${BASH_REMATCH[1]}"
          else
            exit 1
          fi
          filter="resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB_NAME}\" AND labels.\"run.googleapis.com/execution_name\"=\"${execution}\""
          gcloud logging read "${filter}" --project="${PROJECT_ID}" --freshness=6h \
            --limit=200 --order=asc --format=json

  run-proof:
    if: >-
      contains(github.event.head_commit.message, '[postgres-canary]') ||
      contains(github.event.head_commit.message, '[social-media-multisource-a]') ||
      contains(github.event.head_commit.message, '[social-media-multisource-b]')
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Select proof
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "${COMMIT_MESSAGE}" == *"[postgres-canary]"* ]]; then
            echo "PROOF=postgres-canary" >> "${GITHUB_ENV}"
            echo "VARIANT=canary" >> "${GITHUB_ENV}"
          elif [[ "${COMMIT_MESSAGE}" == *"[social-media-multisource-a]"* ]]; then
            echo "PROOF=social-media-multisource" >> "${GITHUB_ENV}"
            echo "VARIANT=A" >> "${GITHUB_ENV}"
          else
            echo "PROOF=social-media-multisource" >> "${GITHUB_ENV}"
            echo "VARIANT=B" >> "${GITHUB_ENV}"
          fi

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify canonical Job boundary
        run: |
          set -euo pipefail
          deployed_sa="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.serviceAccountName)')"
          deployed_image="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          test "${deployed_sa}" = "${RUNTIME_SA}"
          test -n "${deployed_image}"
          echo "DEPLOYED_IMAGE=${deployed_image}" >> "${GITHUB_ENV}"

      - name: Run complete V2 proof on existing Job
        run: |
          set -euo pipefail
          execution="$(gcloud run jobs execute "${JOB_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --args="run-proof-v2,--variant=${VARIANT},--tokens-per-minute=${ADMISSION_TPM},--max-concurrency=${MAX_CONCURRENCY},--per-project-concurrency=${PROJECT_CONCURRENCY}" \
            --format='value(metadata.name)')"
          test -n "${execution}"
          echo "EXECUTION=${execution}" >> "${GITHUB_ENV}"
          for attempt in $(seq 1 510); do
            gcloud run jobs executions describe "${execution}" --project="${PROJECT_ID}" --region="${REGION}" --format=json > /tmp/execution.json
            complete="$(jq -r '.status.conditions[]? | select(.type == "Completed") | .status' /tmp/execution.json | tail -1)"
            if [[ "${complete}" == "True" ]]; then break; fi
            if [[ "${complete}" == "False" ]]; then break; fi
            sleep 20
          done
          test -n "${complete:-}"
          echo "JOB_COMPLETED_STATUS=${complete}" >> "${GITHUB_ENV}"

      - name: Collect and validate immutable receipt from execution logs
        if: always() && env.EXECUTION != ''
        run: |
          set -euo pipefail
          filter="resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB_NAME}\" AND labels.\"run.googleapis.com/execution_name\"=\"${EXECUTION}\""
          for attempt in $(seq 1 30); do
            gcloud logging read "${filter}" --project="${PROJECT_ID}" --freshness=3h \
              --limit=200 --order=asc --format=json > /tmp/container-log.json
            if python - <<'PY'
          import json
          import os
          from pathlib import Path

          entries = json.loads(Path('/tmp/container-log.json').read_text(errors='replace'))
          for entry in entries:
              value = entry.get('jsonPayload')
              if not isinstance(value, dict):
                  try:
                      value = json.loads(entry.get('textPayload', ''))
                  except (json.JSONDecodeError, TypeError):
                      continue
              if value.get('status') == 'failed' or (
                  value.get('status') == 'complete' and value.get('proof', {}).get('variant') == os.environ['VARIANT']
              ):
                  Path('/tmp/proof-result.json').write_text(json.dumps(value, ensure_ascii=False), encoding='utf-8')
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              break
            fi
            sleep 10
          done
          test -s /tmp/proof-result.json
          if [[ "$(jq -r '.status' /tmp/proof-result.json)" == "failed" ]]; then
            jq . /tmp/proof-result.json
            exit 1
          fi
          jq -e '(.status == "complete") and (.proof.variant == env.VARIANT) and
            (.digestion.source_count == (.proof.sources | length)) and
            (.digestion.sentence_count >= 1) and (.digestion.evidence_anchors >= 1) and
            (.article.word_count >= 1) and (.rendered.html.uri | startswith("gs://")) and
            (.usage.report.usage_complete == true) and (.usage.report.pricing_complete == true)' \
            /tmp/proof-result.json >/dev/null
          echo "NEW_PROJECT_ID=$(jq -r '.project_id' /tmp/proof-result.json)" >> "${GITHUB_ENV}"
          echo "HEFESTO_PROOF_RESULT_B64=$(base64 -w0 /tmp/proof-result.json)"

      - name: Compare A and B
        if: env.VARIANT == 'B'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          a_run="$(gh run list --repo="${GITHUB_REPOSITORY}" --workflow=one-shot-social-media-multisource-ab \
            --branch=main --status=success --limit=30 --json databaseId,displayTitle \
            --jq '.[] | select(.displayTitle | contains("[social-media-multisource-a]")) | .databaseId' | head -1)"
          test -n "${a_run}"
          gh run view "${a_run}" --repo="${GITHUB_REPOSITORY}" --log > /tmp/a-run.log
          sed -n 's/^.*HEFESTO_PROOF_RESULT_B64=//p' /tmp/a-run.log | tail -1 | base64 -d > /tmp/a.json
          test -s /tmp/a.json
          python - <<'PY'
          import json
          from pathlib import Path

          a = json.loads(Path('/tmp/a.json').read_text())
          b = json.loads(Path('/tmp/proof-result.json').read_text())
          def metrics(item):
              report, digest = item['usage']['report'], item['digestion']
              return {
                  'project_id': item['project_id'], 'execution_run_id': item['execution_run_id'],
                  'quality_score': item['article']['quality_score'], 'word_count': item['article']['word_count'],
                  'revision_rounds': item['article']['revision_rounds'], 'sources': digest['source_count'],
                  'sections': digest['section_count'], 'sentences': digest['sentence_count'],
                  'dossier_findings': digest['dossier_findings'], 'evidence_anchors': digest['evidence_anchors'],
                  'agreements': digest['cross_source_agreements'], 'divergences': digest['cross_source_divergences'],
                  'coverage_gaps': digest['coverage_gaps'], 'research_subjects': item['production']['research_subjects'],
                  'pipeline_duration_ms': sum(stage['duration_ms'] for stage in item['stages']),
                  'model_calls': report['call_count'], 'attempts': report['attempt_count'],
                  'total_tokens': report['total_tokens'], 'prompt_tokens': report['prompt_tokens'],
                  'output_tokens': report['output_tokens'], 'reasoning_tokens': report['reasoning_tokens'],
                  'rated_cost_usd': report['rated_cost_usd'], 'usage_complete': report['usage_complete'],
                  'pricing_complete': report['pricing_complete'],
                  'article_markdown_uri': item['rendered']['markdown']['uri'],
                  'article_html_uri': item['rendered']['html']['uri'],
              }
          am, bm = metrics(a), metrics(b)
          numeric = ['quality_score', 'word_count', 'revision_rounds', 'sections', 'sentences',
                     'dossier_findings', 'evidence_anchors', 'agreements', 'divergences', 'coverage_gaps',
                     'research_subjects', 'pipeline_duration_ms', 'model_calls', 'attempts', 'total_tokens',
                     'prompt_tokens', 'output_tokens', 'reasoning_tokens', 'rated_cost_usd']
          comparison = {
              'comparison_version': 'hefesto-v2-ab-v1', 'shared_sources': 3,
              'controlled_difference': 'A uses the National Academies highlights; B uses the full report.',
              'A': am, 'B': bm,
              'delta_B_minus_A': {key: float(bm[key]) - float(am[key]) for key in numeric},
          }
          Path('/tmp/comparison.json').write_text(json.dumps(comparison, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(comparison, ensure_ascii=False, indent=2))
          PY
          echo "HEFESTO_AB_COMPARISON_B64=$(base64 -w0 /tmp/comparison.json)"

      - name: Proof summary
        if: always()
        run: |
          {
            echo "# Hefesto V2 relational proof"
            echo "- Proof: \`${PROOF:-not-selected}\`"
            echo "- Variant: \`${VARIANT:-not-selected}\`"
            echo "- Project: \`${NEW_PROJECT_ID:-read-from-receipt}\`"
            echo "- Existing Job: \`${JOB_NAME}\`"
            echo "- Execution: \`${EXECUTION:-not-started}\`"
            echo "- Image: \`${DEPLOYED_IMAGE:-not-read}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
