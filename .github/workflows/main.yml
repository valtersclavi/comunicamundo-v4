name: Hefesto production
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", ".github/workflows/hefesto-v8-*.yml"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: comunicamundo-v4-main
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  REPOSITORY: comunicamundo-v4
  JOB_NAME: hefesto-v4-rebuild
  API_NAME: hefesto-v4-api
  BUCKET: comunicamundo-v4-hefesto-30524898837
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  RUNTIME_SA: hefesto-v4-sa@comunicamundo-v4.iam.gserviceaccount.com
jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.14"
      - name: Test product contract
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -e '.[dev]'
          python -m pip check
          pytest
          python -m compileall -q src tests
          python -m comunicamundo_v8.hefesto.worker --help
      - name: Build image
        run: |
          set -euo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${JOB_NAME}:sha-${GITHUB_SHA}"
          docker build --tag "${image}" .
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"
      - name: Smoke product image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python "${IMAGE}" \
            -m comunicamundo_v8.hefesto.document_smoke
          container="$(docker run --detach --publish 127.0.0.1:8080:8080 \
            --entrypoint uvicorn "${IMAGE}" \
            comunicamundo_v8.hefesto.api:app --host 0.0.0.0 --port 8080)"
          trap 'docker rm --force "${container}" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health >/tmp/health.json; then break; fi
            sleep 1
          done
          jq -e '.status == "ready" and .service == "hefesto-editorial-api"' /tmp/health.json
          curl --fail --silent http://127.0.0.1:8080/ >/tmp/product.html
          grep -q 'Hefesto V8' /tmp/product.html
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Push image
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker push "${IMAGE}"
          digest="$(gcloud artifacts docker images describe "${IMAGE}" --project="${PROJECT_ID}" --format='value(image_summary.digest)')"
          echo "PINNED_IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${JOB_NAME}@${digest}" >> "${GITHUB_ENV}"
      - name: Deploy product job
        run: |
          set -euo pipefail
          gcloud run jobs deploy "${JOB_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --image="${PINNED_IMAGE}" --service-account="${RUNTIME_SA}" \
            --command=comunicamundo-v8-worker \
            --args=--help \
            --cpu=4 --memory=8Gi --task-timeout=7200s --max-retries=0 \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},HEFESTO_GCS_BUCKET=${BUCKET},HEFESTO_V8_MODEL=gemini-2.5-flash,HEFESTO_VERTEX_LOCATION=global" \
            --set-secrets="HEFESTO_POSTGRES_URL=hefesto-postgres-pooler-url:latest,HEFESTO_POSTGRES_DIRECT_URL=hefesto-postgres-direct-url:latest,YOU_API_KEY=you-api-key:latest,OPENALEX_API_KEY=openalex-api-key:latest,JINA_API_KEY=jina-api-key:latest,BROWSER_USE_API_KEY=browser-use-api-key:latest" \
            --quiet
      - name: Deploy product API
        run: |
          set -euo pipefail
          gcloud run jobs add-iam-policy-binding "${JOB_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role="roles/run.jobsExecutorWithOverrides" --quiet
          gcloud run deploy "${API_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --image="${PINNED_IMAGE}" --service-account="${RUNTIME_SA}" \
            --command=uvicorn \
            --args="comunicamundo_v8.hefesto.api:app,--host,0.0.0.0,--port,8080" \
            --cpu=1 --memory=1Gi --min=0 --max=10 --concurrency=40 --timeout=60 \
            --allow-unauthenticated --no-iap \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},HEFESTO_GCS_BUCKET=${BUCKET},HEFESTO_JOB_NAME=${JOB_NAME},HEFESTO_V8_MODEL=gemini-2.5-flash,HEFESTO_VERTEX_LOCATION=global" \
            --set-secrets="HEFESTO_POSTGRES_URL=hefesto-postgres-pooler-url:latest,HEFESTO_POSTGRES_DIRECT_URL=hefesto-postgres-direct-url:latest" \
            --quiet
          api_url="$(gcloud run services describe "${API_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --format='value(status.url)')"
          test -n "${api_url}"
          echo "HEFESTO_API_URL=${api_url}" >> "${GITHUB_ENV}"
          revision="$(gcloud run services describe "${API_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --format='value(status.latestReadyRevisionName)')"
          test -n "${revision}"
          echo "API_REVISION=${revision}" >> "${GITHUB_ENV}"
      - name: Migrate PostgreSQL
        run: |
          set -euo pipefail
          dump_job_failure() {
            local execution
            execution="$(gcloud run jobs executions list --job="${JOB_NAME}" \
              --project="${PROJECT_ID}" --region="${REGION}" --limit=1 \
              --format='value(metadata.name)' || true)"
            if [[ -n "${execution}" ]]; then
              gcloud run jobs executions describe "${execution}" \
                --project="${PROJECT_ID}" --region="${REGION}" --format=json || true
            fi
            gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB_NAME}\" AND timestamp>=\"$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)\"" \
              --project="${PROJECT_ID}" --limit=100 --format='value(textPayload)' || true
          }
          migration="$(gcloud run jobs execute "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --args=migrate-postgres --wait --format='value(metadata.name)')" \
            || { dump_job_failure; exit 1; }
          check="$(gcloud run jobs execute "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --args=check-postgres --wait --format='value(metadata.name)')" \
            || { dump_job_failure; exit 1; }
          test -n "${migration}${check}"
          echo "MIGRATION_EXECUTION=${migration}" >> "${GITHUB_ENV}"
          echo "DATABASE_CHECK_EXECUTION=${check}" >> "${GITHUB_ENV}"
      - name: No-model startup smoke
        run: |
          set -euo pipefail
          smoke="$(gcloud run jobs execute "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --wait --format='value(metadata.name)')"
          test -n "${smoke}"
          echo "JOB_SMOKE_EXECUTION=${smoke}" >> "${GITHUB_ENV}"
      - name: Published V8 HTTP smoke (no model calls)
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors --fail --silent --show-error "${HEFESTO_API_URL}/health" >/tmp/live-health.json
          jq -e '.status == "ready" and .service == "hefesto-editorial-api"' /tmp/live-health.json
          curl --retry 3 --retry-all-errors --fail --silent --show-error "${HEFESTO_API_URL}/v8" >/tmp/live-v8.html
          grep -q 'Hefesto V8' /tmp/live-v8.html
          curl --fail --silent "${HEFESTO_API_URL}/assets/v8.js" >/tmp/live-v8.js
          grep -q 'project_proposed' /tmp/live-v8.js
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "${HEFESTO_API_URL}/v8/projects")" = 401
          echo "V8_URL=${HEFESTO_API_URL}/v8" >> "${GITHUB_ENV}"
      - name: Publish deployment receipt
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          cat > /tmp/deploy-receipt.md <<EOF
          ## Deploy Hefesto V8 — ${JOB_STATUS}

          - Commit: \`${GITHUB_SHA}\`
          - Job: \`${JOB_NAME}\`
          - API: \`${API_NAME}\`
          - API revision: \`${API_REVISION:-not-deployed}\`
          - Product URL: ${V8_URL:-not-verified}
          - Image: \`${PINNED_IMAGE:-not-built}\`
          - PostgreSQL migration: \`${MIGRATION_EXECUTION:-not-run}\`
          - PostgreSQL check: \`${DATABASE_CHECK_EXECUTION:-not-run}\`
          - Job smoke: \`${JOB_SMOKE_EXECUTION:-not-run}\`
          - Actions run: \`${GITHUB_RUN_ID}\`
          EOF
          cat /tmp/deploy-receipt.md >> "${GITHUB_STEP_SUMMARY}"
          cat /tmp/deploy-receipt.md

