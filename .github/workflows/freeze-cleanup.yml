name: freeze-cleanup
on:
  workflow_run:
    workflows: [main]
    types: [completed]
permissions:
  contents: write
  id-token: write
  issues: write
concurrency:
  group: hefesto-v4-freeze-cleanup
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  BUCKET: comunicamundo-v4-hefesto-30524898837
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  KEEP_A: f88c65b4-414b-56d1-9820-19489159922c
  KEEP_B: d9a77477-e5aa-5dbc-ad1a-e8434a84e98e
  CORE_SHA: 7eb1cd8273f805ba682623857d360618a7516687
  BASELINE_TAG: hefesto-v4-core-v1
jobs:
  cleanup:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check one-time guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${BASELINE_TAG}" >/dev/null 2>&1; then
            echo "run=false" >> "${GITHUB_OUTPUT}"
          else
            echo "run=true" >> "${GITHUB_OUTPUT}"
          fi
      - uses: google-github-actions/auth@v3
        if: steps.guard.outputs.run == 'true'
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
        if: steps.guard.outputs.run == 'true'
      - name: Clean operational history
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          execution="$(gcloud run jobs execute "${JOB_NAME}"             --project="${PROJECT_ID}" --region="${REGION}"             --args="clean-operational-history,${KEEP_A},${KEEP_B},--execute"             --wait --format='value(metadata.name)')"
          test -n "${execution}"
          gcloud storage cat "gs://${BUCKET}/hefesto-product/maintenance/freeze-cleanup.json" > /tmp/freeze-cleanup.json
          jq -e --arg a "${KEEP_A}" --arg b "${KEEP_B}" '
            .status == "executed"
            and (.preserved_execution_run_ids | sort) == ([$a, $b] | sort)
          ' /tmp/freeze-cleanup.json
          echo "CLEANUP_EXECUTION=${execution}" >> "${GITHUB_ENV}"
      - name: Delete every non-main branch
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100"             --jq '.[].name' > /tmp/branches.txt
          deleted=0
          while IFS= read -r branch; do
            if [[ -z "${branch}" || "${branch}" == "main" ]]; then
              continue
            fi
            encoded="$(jq -rn --arg value "${branch}" '$value | @uri')"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
            deleted=$((deleted + 1))
          done < /tmp/branches.txt
          remaining="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')"
          test "${remaining}" = "main"
          echo "BRANCHES_DELETED=${deleted}" >> "${GITHUB_ENV}"
      - name: Create immutable baseline tag
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs"             -f ref="refs/tags/${BASELINE_TAG}" -f sha="${CORE_SHA}" >/dev/null
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${BASELINE_TAG}" --jq '.object.sha')"
          test "${actual}" = "${CORE_SHA}"
      - name: Publish freeze receipt
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "## Hefesto V4 — baseline congelada"
            echo
            echo "- Núcleo: \`${CORE_SHA}\`"
            echo "- Tag: \`${BASELINE_TAG}\`"
            echo "- Teste A preservado: \`${KEEP_A}\`"
            echo "- Teste B preservado: \`${KEEP_B}\`"
            echo "- Execução da limpeza: \`${CLEANUP_EXECUTION}\`"
            echo "- Branches removidas: \`${BRANCHES_DELETED}\`"
            echo
            echo '~~~json'
            jq '.' /tmp/freeze-cleanup.json
            echo '~~~'
          } > /tmp/freeze-receipt.md
          gh issue comment 119 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/freeze-receipt.md
