name: one-shot-isolated-luto-axis-feedback-clean-v2
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
concurrency:
  group: hefesto-v4-isolated-luto-axis-feedback-clean-v2
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  PROOF_SERVICE: hefesto-v4-isolated-luto-axis-feedback-clean-v2
  BUCKET: comunicamundo-v4-hefesto-30524898837
  CANONICAL_RUN_ID: 94d992ae-40fe-4913-8a1a-2052984dd23d
  ORIGINAL_AXIS_ID: aa70d5d0-d04e-491c-890e-f06e1566148b
  CLONE_RUN_ID: cef3b6a8-cf58-4eb9-80af-ea3b0cec08cb
  CLONE_AXIS_ID: a57c8608-d376-45fb-87dd-578baaa14c97
  CLONE_REQUEST_FINGERPRINT: f1cd67eeea9da5941c3af9656399f3eb530a37e7b0ca342d670fb403f6813f65
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  RUNTIME_SA: hefesto-v4-sa@comunicamundo-v4.iam.gserviceaccount.com
  RESULT_PATH: .github/proof-results/isolated-luto-axis-feedback-clean-v2-2026-08-29.json
jobs:
  react-cleanly:
    if: ${{ contains(github.event.head_commit.message, '[isolated-luto-axis-feedback-clean-v2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy isolated proof service
        run: |
          set -euo pipefail
          pinned_image="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          test -n "${pinned_image}"
          proof_token="$(openssl rand -hex 32)"
          cat > /tmp/proof_service.py <<'PY'
          import hmac, json, os
          from datetime import UTC, datetime
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from uuid import UUID
          from comunicamundo_v4.hefesto.contracts import NarrativeAxisStatus, PlanningRunState
          from comunicamundo_v4.hefesto.worker import _planning_persistence, run_review_axis_feedback_command

          TOKEN=os.environ['PROOF_TOKEN']
          CANONICAL_RUN_ID=UUID(os.environ['PROOF_CANONICAL_RUN_ID'])
          ORIGINAL_AXIS_ID=UUID(os.environ['PROOF_ORIGINAL_AXIS_ID'])
          CLONE_RUN_ID=UUID(os.environ['PROOF_CLONE_RUN_ID'])
          CLONE_AXIS_ID=UUID(os.environ['PROOF_CLONE_AXIS_ID'])
          CLONE_REQUEST_FINGERPRINT=os.environ['PROOF_CLONE_REQUEST_FINGERPRINT']
          FEEDBACK=('Falta um foco mais forte no luto infantil em si. '
                    'Também ficou de fora que o adulto responsável pela criança pode estar vivendo '
                    'a própria confusão e o próprio luto.')

          def proof():
              p=_planning_persistence()
              canonical=p.get_run(CANONICAL_RUN_ID)
              if canonical is None: raise ValueError('canonical PlanningRun not found')
              original_stored=p.get_axis(ORIGINAL_AXIS_ID)
              if original_stored is None: raise ValueError('original Narrative Axis not found')
              original_axis=original_stored.narrative_axis
              canonical_understanding=p.load_understanding(canonical.artifacts.understanding_uri)
              current_persisted=p.load_narrative_axis(canonical.artifacts.narrative_axis_uri)
              now=datetime.now(UTC)
              clone_axis=original_axis.model_copy(update={'narrative_axis_id':CLONE_AXIS_ID,'status':NarrativeAxisStatus.PROPOSED,'approved_at':None,'created_at':now})
              base_artifacts=canonical.artifacts.model_copy(update={
                  'understanding_uri':None,'narrative_axis_id':CLONE_AXIS_ID,'narrative_axis_uri':None,
                  'axis_feedback_decision_id':None,'axis_feedback_decision_uri':None,
                  'editorial_project_id':None,'editorial_project_uri':None})
              clone_run=canonical.model_copy(update={
                  'planning_run_id':CLONE_RUN_ID,'request_fingerprint':CLONE_REQUEST_FINGERPRINT,
                  'state':PlanningRunState.AXIS_PROPOSED,'artifacts':base_artifacts,
                  'error':None,'created_at':now,'updated_at':now})
              clone_understanding=canonical_understanding.model_copy(update={'planning_run_id':CLONE_RUN_ID})
              understanding_uri=p.persist_understanding(clone_run,clone_understanding)
              clone_record=current_persisted.model_copy(update={
                  'planning_run_id':CLONE_RUN_ID,'request_fingerprint':CLONE_REQUEST_FINGERPRINT,
                  'narrative_axis':clone_axis,'created_at':now})
              axis_uri=p.persist_narrative_axis(clone_run,clone_record)
              clone_artifacts=base_artifacts.model_copy(update={
                  'understanding_uri':understanding_uri,'narrative_axis_id':CLONE_AXIS_ID,'narrative_axis_uri':axis_uri})
              clone_run=clone_run.model_copy(update={'artifacts':clone_artifacts})
              p.save_axis(original_stored.model_copy(update={
                  'narrative_axis':clone_axis,'planning_run_id':CLONE_RUN_ID,'editorial_project_id':None}))
              p.save_run(clone_run)
              result=run_review_axis_feedback_command(CLONE_RUN_ID,FEEDBACK)
              d=result.decision
              assert result.planning_run.state is PlanningRunState.AXIS_PROPOSED
              assert result.narrative_axis.status is NarrativeAxisStatus.PROPOSED
              assert result.human_approval_required is True
              assert result.search_performed is False
              assert result.editorial_project_created is False
              return {
                  'status':'SUCCESS','canonical_run_id':str(CANONICAL_RUN_ID),'clone_run_id':str(CLONE_RUN_ID),
                  'original_axis':original_axis.statement,'feedback':FEEDBACK,
                  'impact':d.impact.value,'affected_premises':d.affected_premises,
                  'editorial_consequences':d.editorial_consequences,'impact_rationale':d.impact_rationale,
                  'support':d.support.value,'support_rationale':d.support_rationale,
                  'axis_action':d.axis_action.value,'treatment_scale':d.treatment_scale.value,
                  'treatment_rationale':d.treatment_rationale,'enrichment_need':d.enrichment_need,
                  'decision_rationale':d.decision_rationale,
                  'carry_forward':None if d.carry_forward is None else d.carry_forward.model_dump(mode='json'),
                  'result_axis_id':str(result.narrative_axis.narrative_axis_id),
                  'result_axis':result.narrative_axis.statement,
                  'result_axis_status':result.narrative_axis.status.value,
                  'human_approval_required':result.human_approval_required,
                  'search_performed':result.search_performed,
                  'editorial_project_created':result.editorial_project_created,
                  'research_needed':result.research_needed,'stopped_at':result.stopped_at}

          class H(BaseHTTPRequestHandler):
              def out(self,s,p):
                  b=json.dumps(p,ensure_ascii=False,indent=2).encode(); self.send_response(s); self.send_header('Content-Type','application/json'); self.send_header('Content-Length',str(len(b))); self.end_headers(); self.wfile.write(b)
              def do_GET(self):
                  if not hmac.compare_digest(self.headers.get('X-Proof-Token',''),TOKEN): self.out(403,{'status':'FAILURE','error':'forbidden'}); return
                  if self.path=='/health': self.out(200,{'status':'ok','model_invocation':'none'}); return
                  if self.path=='/proof':
                      try: self.out(200,proof())
                      except Exception as e: self.out(500,{'status':'FAILURE','error':type(e).__name__,'message':str(e)})
                      return
                  self.out(404,{'status':'FAILURE','error':'not_found'})
              def log_message(self,*a): return
          ThreadingHTTPServer(('0.0.0.0',int(os.environ.get('PORT','8080'))),H).serve_forever()
          PY
          proof_b64="$(base64 -w0 /tmp/proof_service.py)"
          gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet >/dev/null 2>&1 || true
          gcloud run deploy "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --image="${pinned_image}" --service-account="${RUNTIME_SA}" --command=python --args=-c,"import base64;import os;exec(base64.b64decode(os.environ['PROOF_SCRIPT_B64']))" --cpu=4 --memory=8Gi --concurrency=1 --max-instances=1 --min-instances=0 --timeout=3600 --allow-unauthenticated --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},HEFESTO_GCS_BUCKET=${BUCKET},PROOF_CANONICAL_RUN_ID=${CANONICAL_RUN_ID},PROOF_ORIGINAL_AXIS_ID=${ORIGINAL_AXIS_ID},PROOF_CLONE_RUN_ID=${CLONE_RUN_ID},PROOF_CLONE_AXIS_ID=${CLONE_AXIS_ID},PROOF_CLONE_REQUEST_FINGERPRINT=${CLONE_REQUEST_FINGERPRINT},PROOF_SCRIPT_B64=${proof_b64},PROOF_TOKEN=${proof_token}" --quiet
          echo "PROOF_URL=$(gcloud run services describe "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')" >> "${GITHUB_ENV}"
          echo "PROOF_TOKEN=${proof_token}" >> "${GITHUB_ENV}"
      - name: Run isolated feedback reaction
        run: |
          set +e
          curl -sS --max-time 3550 -H "X-Proof-Token: ${PROOF_TOKEN}" "${PROOF_URL}/proof" -o /tmp/result.json -w '%{http_code}' > /tmp/http_code
          curl_rc=$?
          printf '\n' >> /tmp/http_code
          if [ ! -s /tmp/result.json ]; then jq -n --argjson curl_rc "${curl_rc}" '{status:"FAILURE",curl_rc:$curl_rc,message:"no response body"}' > /tmp/result.json; fi
          cat /tmp/result.json
      - name: Persist result even on failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/result.json ]; then printf '%s\n' '{"status":"FAILURE","message":"failed before proof response"}' > /tmp/result.json; fi
          encoded="$(base64 -w0 /tmp/result.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${RESULT_PATH}" -f message='Persist isolated clean luto Axis feedback v2 result [no-deploy]' -f content="${encoded}" >/dev/null
      - name: Cleanup
        if: always()
        run: gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet || true
