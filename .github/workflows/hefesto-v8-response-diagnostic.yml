name: Hefesto V8 response diagnosis (SELECT only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/hefesto-v8-response-diagnostic.yml]
permissions:
  contents: read
  id-token: write
jobs:
  collect-read-only-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: comunicamundo-v4
          workload_identity_provider: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
          service_account: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read complete retained diagnostic export without executing any job
        run: |
          set -euo pipefail
          gcloud logging read 'resource.type="cloud_run_job" AND resource.labels.job_name="hefesto-v8-response-read-37785224715"' --project=comunicamundo-v4 --limit=5000 --format='value(textPayload)' > "${RUNNER_TEMP}/response-diagnostic.txt"
          python - <<'PY'
          import base64,hashlib,json,os,zlib
          from pathlib import Path
          lines=Path(os.environ["RUNNER_TEMP"],"response-diagnostic.txt").read_text().splitlines()
          meta=[json.loads(x.split("HEFESTO_DIAG_META ",1)[1]) for x in lines if x.startswith("HEFESTO_DIAG_META ")][0]
          parts=[json.loads(x.split("HEFESTO_DIAG_PART ",1)[1]) for x in lines if x.startswith("HEFESTO_DIAG_PART ")]
          parts.sort(key=lambda x:x["index"])
          assert [p["index"] for p in parts]==list(range(meta["chunks"]))
          raw=zlib.decompress(base64.b64decode("".join(x["data"] for x in parts)))
          assert hashlib.sha256(raw).hexdigest()==meta["sha256"]
          print("COMPLETE_EXPORT",json.dumps(meta))
          # The artifact contains exact text; log only precise diagnostics.
          data=json.loads(raw)
          for p in data["projects"]:
              print("PROJECT",json.dumps({k:p[k] for k in ["execution_id","project_id","status","error"]},ensure_ascii=False))
              for o in p["operations"]:
                  j=o["journal"]
                  print("OPERATION",json.dumps({"key":o["key"],"stage":j.get("stage"),"parse_error":j.get("parse_error"),"attempts":[{"mode":a.get("mode"),"finish":a.get("finish"),"text_length":len(a.get("text",""))} for a in j.get("attempts",[])]},ensure_ascii=False))
          Path(os.environ["RUNNER_TEMP"],"response-diagnostic.json").write_bytes(raw)
          PY
          cat "${RUNNER_TEMP}/response-diagnostic.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hefesto-v8-response-complete-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/response-diagnostic.txt
            ${{ runner.temp }}/response-diagnostic.json
          retention-days: 7
