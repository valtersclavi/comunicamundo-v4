name: one-shot-inspect-isolated-luto-axis-clean
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
concurrency:
  group: hefesto-v4-inspect-isolated-luto-axis-clean
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  PROOF_SERVICE: hefesto-v4-inspect-isolated-luto-axis-clean
  BUCKET: comunicamundo-v4-hefesto-30524898837
  CLONE_RUN_ID: cef3b6a8-cf58-4eb9-80af-ea3b0cec08cb
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  RUNTIME_SA: hefesto-v4-sa@comunicamundo-v4.iam.gserviceaccount.com
  RESULT_PATH: .github/proof-results/isolated-luto-axis-clean-state-2026-08-29.json
jobs:
  inspect:
    if: ${{ contains(github.event.head_commit.message, '[inspect-isolated-luto-axis-clean]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy read-only inspector
        run: |
          set -euo pipefail
          pinned_image="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          proof_token="$(openssl rand -hex 32)"
          cat > /tmp/inspect_service.py <<'PY'
          import hmac, json, os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from uuid import UUID
          from comunicamundo_v4.hefesto.persistence import GcpEditorialPersistence, GcpPersistenceSettings
          TOKEN=os.environ['PROOF_TOKEN']; RUN_ID=UUID(os.environ['PROOF_CLONE_RUN_ID'])
          def inspect():
              p=GcpEditorialPersistence.from_settings(GcpPersistenceSettings(project=os.environ['GOOGLE_CLOUD_PROJECT'],bucket=os.environ['HEFESTO_GCS_BUCKET']))
              run=p.get_run(RUN_ID)
              if run is None:
                  return {'clone_run_exists':False,'clone_run_id':str(RUN_ID)}
              axis=None
              if run.artifacts.narrative_axis_uri:
                  axis=p.load_narrative_axis(run.artifacts.narrative_axis_uri).narrative_axis.model_dump(mode='json')
              decision=None
              if run.artifacts.axis_feedback_decision_uri:
                  decision=p.load_axis_feedback_decision(run.artifacts.axis_feedback_decision_uri).model_dump(mode='json')
              return {'clone_run_exists':True,'clone_run':run.model_dump(mode='json'),'axis':axis,'decision':decision}
          class H(BaseHTTPRequestHandler):
              def out(self,s,p):
                  b=json.dumps(p,ensure_ascii=False,indent=2).encode(); self.send_response(s); self.send_header('Content-Type','application/json'); self.send_header('Content-Length',str(len(b))); self.end_headers(); self.wfile.write(b)
              def do_GET(self):
                  if not hmac.compare_digest(self.headers.get('X-Proof-Token',''),TOKEN): self.out(403,{'error':'forbidden'}); return
                  try: self.out(200,inspect())
                  except Exception as e: self.out(500,{'error':type(e).__name__,'message':str(e)})
              def log_message(self,*a): return
          ThreadingHTTPServer(('0.0.0.0',int(os.environ.get('PORT','8080'))),H).serve_forever()
          PY
          proof_b64="$(base64 -w0 /tmp/inspect_service.py)"
          gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet >/dev/null 2>&1 || true
          gcloud run deploy "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --image="${pinned_image}" --service-account="${RUNTIME_SA}" --command=python --args=-c,"import base64;import os;exec(base64.b64decode(os.environ['PROOF_SCRIPT_B64']))" --cpu=2 --memory=4Gi --concurrency=1 --max-instances=1 --min-instances=0 --timeout=900 --allow-unauthenticated --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},HEFESTO_GCS_BUCKET=${BUCKET},PROOF_CLONE_RUN_ID=${CLONE_RUN_ID},PROOF_SCRIPT_B64=${proof_b64},PROOF_TOKEN=${proof_token}" --quiet
          echo "PROOF_URL=$(gcloud run services describe "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')" >> "${GITHUB_ENV}"
          echo "PROOF_TOKEN=${proof_token}" >> "${GITHUB_ENV}"
      - name: Inspect clone state
        run: |
          set -euo pipefail
          curl -sS -H "X-Proof-Token: ${PROOF_TOKEN}" "${PROOF_URL}/" | tee /tmp/result.json
      - name: Persist inspection
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/result.json ]; then printf '%s\n' '{"inspection_failed_before_result":true}' > /tmp/result.json; fi
          encoded="$(base64 -w0 /tmp/result.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${RESULT_PATH}" -f message='Persist isolated luto clean-state inspection [no-deploy]' -f content="${encoded}" >/dev/null
      - name: Cleanup
        if: always()
        run: gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet || true
