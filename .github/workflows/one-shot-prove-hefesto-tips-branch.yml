name: one-shot-prove-project-freeze-branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prove:
    if: ${{ contains(github.event.head_commit.message, '[project-freeze-branch-proof]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: freeze-project-scope-before-production-2026-08-29
          path: implementation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Full test suite
        working-directory: implementation
        run: python -m pytest
      - name: Compile
        working-directory: implementation
        run: python -m compileall -q src tests
      - name: Frozen Project scope proof
        working-directory: implementation
        run: python -m pytest -q tests/test_project_freeze.py tests/test_hefesto_tips.py
      - name: Record success on main
        if: success()
        uses: actions/checkout@v4
        with:
          ref: main
          path: proof-main
      - name: Persist success
        if: success()
        working-directory: proof-main
        run: |
          mkdir -p .github/proof-results
          cat > .github/proof-results/project-freeze-branch-2026-08-29.json <<'JSON'
          {
            "status": "SUCCESS",
            "branch": "freeze-project-scope-before-production-2026-08-29",
            "head": "b78262afab0fe5c2923513ac760b023351741180",
            "checks": [
              "full pytest",
              "compileall",
              "revised Project suppresses enrichment opportunities",
              "production excludes Dicas do Hefesto and enrichment opportunities"
            ]
          }
          JSON
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/proof-results/project-freeze-branch-2026-08-29.json
          git commit -m 'Record Project freeze branch proof [no-deploy]'
          git push origin HEAD:main
