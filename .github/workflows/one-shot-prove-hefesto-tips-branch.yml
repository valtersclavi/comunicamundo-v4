name: one-shot-prove-production-headroom-branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prove:
    if: ${{ contains(github.event.head_commit.message, '[production-headroom-branch-proof]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix-production-output-headroom-2026-08-29
          path: implementation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Full test suite
        working-directory: implementation
        run: python -m pytest
      - name: Compile
        working-directory: implementation
        run: python -m compileall -q src tests
      - name: Production headroom proof
        working-directory: implementation
        run: python -m pytest -q tests/test_production_runtime_headroom.py tests/test_project_freeze.py
      - name: Record success on main
        if: success()
        uses: actions/checkout@v4
        with:
          ref: main
          path: proof-main
      - name: Persist success
        if: success()
        working-directory: proof-main
        run: |
          mkdir -p .github/proof-results
          cat > .github/proof-results/production-headroom-branch-2026-08-29.json <<'JSON'
          {
            "status": "SUCCESS",
            "branch": "fix-production-output-headroom-2026-08-29",
            "head": "dd491be347e0c64e6f5daedd8352d36e8763e811",
            "checks": [
              "full pytest",
              "compileall",
              "Gemini production stages have thinking-token headroom",
              "production scope freeze remains enforced"
            ]
          }
          JSON
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/proof-results/production-headroom-branch-2026-08-29.json
          git commit -m 'Record production headroom branch proof [no-deploy]'
          git push origin HEAD:main
