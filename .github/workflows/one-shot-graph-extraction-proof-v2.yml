name: one-shot-graph-extraction-proof-v2
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hefesto-v4-one-shot-graph-extraction-proof-v2
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  BUCKET: comunicamundo-v4-hefesto-30524898837
  OBJECT_NAME: proofs/graph-extraction-one-chunk/request-v2.json
  REQUEST_URI: gs://comunicamundo-v4-hefesto-30524898837/proofs/graph-extraction-one-chunk/request-v2.json
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
jobs:
  prove-one-chunk:
    if: ${{ contains(github.event.head_commit.message, '[graph-extraction-proof-v2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - name: Install proof reader
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -e .
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Create request object without read/list
        run: |
          set -euo pipefail
          cat > request.json <<'JSON'
          {
            "project_id": "20260827-0000-4000-8000-000000000001",
            "brief": {
              "theme": "Prova atomica de extracao de grafo",
              "approach": "Identificar apenas relacoes explicitas no texto",
              "duration_minutes": 1,
              "output_language": "pt-BR",
              "product": "article"
            },
            "sources": [{
              "source_id": "20260827-0000-4000-8000-000000000002",
              "text": "Maria e mae de Joao. Maria acompanha Joao durante o luto. Joao percebe a ausencia do pai.",
              "language": "pt-BR",
              "title": "Prova atomica",
              "metadata": {"proof": "graph-extraction-one-chunk-v2"}
            }]
          }
          JSON
          python - <<'PY'
          import json
          from comunicamundo_v4.hefesto.contracts import PlanningRequest
          from comunicamundo_v4.hefesto.planning import prepare_source_chunks
          request = PlanningRequest.model_validate(json.load(open('request.json', encoding='utf-8')))
          chunks = prepare_source_chunks(request.sources)
          assert len(chunks) == 1, len(chunks)
          print('LOCAL_PROOF_CHUNKS=1')
          PY
          token="$(gcloud auth print-access-token)"
          code="$(curl -sS -o upload-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            --data-binary @request.json \
            "https://storage.googleapis.com/upload/storage/v1/b/${BUCKET}/o?uploadType=media&name=proofs%2Fgraph-extraction-one-chunk%2Frequest-v2.json&ifGenerationMatch=0")"
          echo "UPLOAD_HTTP=${code}"
          if [ "${code}" != "200" ]; then cat upload-response.json; exit 1; fi
      - name: Persist one chunk with plan
        run: |
          set -euo pipefail
          execution="$(gcloud run jobs execute "${JOB_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --args="plan,--request,${REQUEST_URI}" --wait \
            --format='value(metadata.name)')"
          test -n "${execution}"
          echo "PLAN_EXECUTION=${execution}" >> "${GITHUB_ENV}"
      - name: Resolve SourceLineage from Firestore
        id: lineage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from google.cloud import firestore
          from comunicamundo_v4.hefesto.contracts import PlanningRequest
          from comunicamundo_v4.hefesto.persistence import source_lineage_lookup_id
          from comunicamundo_v4.hefesto.planning import fingerprint_sources
          request = PlanningRequest.model_validate(json.load(open('request.json', encoding='utf-8')))
          fp = fingerprint_sources(request.sources)
          lookup_id = source_lineage_lookup_id(request.project_id, fp)
          db = firestore.Client(project=os.environ['PROJECT_ID'])
          key = db.collection('hefesto_v4_rebuild_source_lineage_keys').document(lookup_id).get()
          assert key.exists, 'source lineage key missing'
          source_lineage_id = key.to_dict()['source_lineage_id']
          lineage = db.collection('hefesto_v4_rebuild_source_lineages').document(source_lineage_id).get()
          assert lineage.exists, 'source lineage missing'
          data = lineage.to_dict()
          assert data.get('chunk_count') == 1, data
          assert data.get('state') == 'chunks_ready', data
          print(f'SOURCE_LINEAGE_ID={source_lineage_id}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'source_lineage_id={source_lineage_id}\n')
          PY
      - name: Run exactly one real graph extraction
        env:
          SOURCE_LINEAGE_ID: ${{ steps.lineage.outputs.source_lineage_id }}
        run: |
          set -euo pipefail
          execution="$(gcloud run jobs execute "${JOB_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --args="extract-graph,--source-lineage-id,${SOURCE_LINEAGE_ID}" --wait \
            --format='value(metadata.name)')"
          test -n "${execution}"
          echo "EXTRACT_EXECUTION=${execution}" >> "${GITHUB_ENV}"
      - name: Validate durable terminal state
        env:
          SOURCE_LINEAGE_ID: ${{ steps.lineage.outputs.source_lineage_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from google.cloud import firestore
          db = firestore.Client(project=os.environ['PROJECT_ID'])
          snap = db.collection('hefesto_v4_rebuild_source_lineages').document(os.environ['SOURCE_LINEAGE_ID']).get()
          assert snap.exists
          data = snap.to_dict()
          assert data.get('state') == 'graph_extractions_ready', data
          assert data.get('chunk_count') == 1, data
          assert data.get('extracted_count') == 1, data
          assert data.get('failed_count') == 0, data
          assert data.get('graph_extractions_manifest_uri'), data
          print(json.dumps({
            'GRAPH_EXTRACTION_PROOF': 'SUCCESS',
            'source_lineage_id': os.environ['SOURCE_LINEAGE_ID'],
            'state': data['state'],
            'chunk_count': data['chunk_count'],
            'extracted_count': data['extracted_count'],
            'failed_count': data['failed_count'],
            'manifest_uri': data['graph_extractions_manifest_uri'],
          }))
          PY
      - name: Result
        if: always()
        run: |
          {
            echo '# One-chunk graph extraction proof v2'
            echo "- Plan execution: \`${PLAN_EXECUTION:-NOT_RUN}\`"
            echo "- Extract execution: \`${EXTRACT_EXECUTION:-NOT_RUN}\`"
            echo "- SourceLineage: \`${{ steps.lineage.outputs.source_lineage_id || 'NOT_RESOLVED' }}\`"
            echo '- Paid graph extraction calls intended: exactly 1 if extract step is reached'
          } >> "${GITHUB_STEP_SUMMARY}"
