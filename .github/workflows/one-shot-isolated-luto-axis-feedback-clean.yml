name: one-shot-isolated-luto-axis-feedback-clean
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
concurrency:
  group: hefesto-v4-isolated-luto-axis-feedback-clean
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  PROOF_SERVICE: hefesto-v4-isolated-luto-axis-feedback-clean
  BUCKET: comunicamundo-v4-hefesto-30524898837
  CANONICAL_RUN_ID: 94d992ae-40fe-4913-8a1a-2052984dd23d
  ORIGINAL_AXIS_ID: aa70d5d0-d04e-491c-890e-f06e1566148b
  CLONE_RUN_ID: cef3b6a8-cf58-4eb9-80af-ea3b0cec08cb
  CLONE_AXIS_ID: a57c8608-d376-45fb-87dd-578baaa14c97
  CLONE_REQUEST_FINGERPRINT: f1cd67eeea9da5941c3af9656399f3eb530a37e7b0ca342d670fb403f6813f65
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  RUNTIME_SA: hefesto-v4-sa@comunicamundo-v4.iam.gserviceaccount.com
  RESULT_PATH: .github/proof-results/isolated-luto-axis-feedback-clean-2026-08-29.json
jobs:
  react-cleanly:
    if: ${{ contains(github.event.head_commit.message, '[isolated-luto-axis-feedback-clean]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy isolated proof service
        run: |
          set -euo pipefail
          pinned_image="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          test -n "${pinned_image}"
          deployed_sa="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.serviceAccountName)')"
          test "${deployed_sa}" = "${RUNTIME_SA}"
          proof_token="$(openssl rand -hex 32)"

          cat > /tmp/proof_service.py <<'PY'
          import hmac
          import json
          import os
          from datetime import UTC, datetime
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from uuid import UUID

          from comunicamundo_v4.hefesto.contracts import NarrativeAxisStatus, PlanningRunState
          from comunicamundo_v4.hefesto.worker import _planning_persistence, run_review_axis_feedback_command

          TOKEN = os.environ['PROOF_TOKEN']
          CANONICAL_RUN_ID = UUID(os.environ['PROOF_CANONICAL_RUN_ID'])
          ORIGINAL_AXIS_ID = UUID(os.environ['PROOF_ORIGINAL_AXIS_ID'])
          CLONE_RUN_ID = UUID(os.environ['PROOF_CLONE_RUN_ID'])
          CLONE_AXIS_ID = UUID(os.environ['PROOF_CLONE_AXIS_ID'])
          CLONE_REQUEST_FINGERPRINT = os.environ['PROOF_CLONE_REQUEST_FINGERPRINT']
          FEEDBACK = (
              'Falta um foco mais forte no luto infantil em si. '
              'Também ficou de fora que o adulto responsável pela criança pode estar vivendo '
              'a própria confusão e o próprio luto.'
          )

          def run_proof():
              p = _planning_persistence()
              canonical = p.get_run(CANONICAL_RUN_ID)
              if canonical is None:
                  raise ValueError('canonical PlanningRun not found')
              original_stored = p.get_axis(ORIGINAL_AXIS_ID)
              if original_stored is None:
                  raise ValueError('original Narrative Axis not found')
              original_axis = original_stored.narrative_axis
              current_persisted = p.load_narrative_axis(canonical.artifacts.narrative_axis_uri)

              clone_axis = original_axis.model_copy(update={
                  'narrative_axis_id': CLONE_AXIS_ID,
                  'status': NarrativeAxisStatus.PROPOSED,
                  'approved_at': None,
                  'created_at': datetime.now(UTC),
              })
              clone_artifacts = canonical.artifacts.model_copy(update={
                  'narrative_axis_id': CLONE_AXIS_ID,
                  'narrative_axis_uri': None,
                  'axis_feedback_decision_id': None,
                  'axis_feedback_decision_uri': None,
                  'editorial_project_id': None,
                  'editorial_project_uri': None,
              })
              clone_run = canonical.model_copy(update={
                  'planning_run_id': CLONE_RUN_ID,
                  'request_fingerprint': CLONE_REQUEST_FINGERPRINT,
                  'state': PlanningRunState.AXIS_PROPOSED,
                  'artifacts': clone_artifacts,
                  'error': None,
                  'created_at': datetime.now(UTC),
                  'updated_at': datetime.now(UTC),
              })
              clone_record = current_persisted.model_copy(update={
                  'planning_run_id': CLONE_RUN_ID,
                  'request_fingerprint': CLONE_REQUEST_FINGERPRINT,
                  'narrative_axis': clone_axis,
                  'created_at': datetime.now(UTC),
              })
              axis_uri = p.persist_narrative_axis(clone_run, clone_record)
              clone_run = clone_run.model_copy(update={
                  'artifacts': clone_artifacts.model_copy(update={
                      'narrative_axis_id': CLONE_AXIS_ID,
                      'narrative_axis_uri': axis_uri,
                  })
              })
              p.save_axis(original_stored.model_copy(update={
                  'narrative_axis': clone_axis,
                  'planning_run_id': CLONE_RUN_ID,
                  'editorial_project_id': None,
              }))
              p.save_run(clone_run)

              result = run_review_axis_feedback_command(CLONE_RUN_ID, FEEDBACK)
              d = result.decision
              carry = d.carry_forward
              assert result.planning_run.state is PlanningRunState.AXIS_PROPOSED, result
              assert result.narrative_axis.status is NarrativeAxisStatus.PROPOSED, result
              assert result.human_approval_required is True, result
              assert result.search_performed is False, result
              assert result.editorial_project_created is False, result
              return {
                  'ISOLATED_LUTO_AXIS_FEEDBACK_CLEAN': 'SUCCESS',
                  'canonical_run_untouched': str(CANONICAL_RUN_ID),
                  'isolated_clone_run_id': str(CLONE_RUN_ID),
                  'original_axis_id': str(ORIGINAL_AXIS_ID),
                  'original_axis': original_axis.statement,
                  'feedback': FEEDBACK,
                  'decision_id': str(d.feedback_decision_id),
                  'decision_state': d.state.value,
                  'impact': d.impact.value,
                  'affected_premises': d.affected_premises,
                  'editorial_consequences': d.editorial_consequences,
                  'impact_rationale': d.impact_rationale,
                  'support': d.support.value,
                  'support_rationale': d.support_rationale,
                  'axis_action': d.axis_action.value,
                  'treatment_scale': d.treatment_scale.value,
                  'treatment_rationale': d.treatment_rationale,
                  'enrichment_need': d.enrichment_need,
                  'decision_rationale': d.decision_rationale,
                  'carry_forward': None if carry is None else carry.model_dump(mode='json'),
                  'result_axis_id': str(result.narrative_axis.narrative_axis_id),
                  'result_axis': result.narrative_axis.statement,
                  'result_axis_status': result.narrative_axis.status.value,
                  'human_approval_required': result.human_approval_required,
                  'search_performed': result.search_performed,
                  'editorial_project_created': result.editorial_project_created,
                  'research_needed': result.research_needed,
                  'stopped_at': result.stopped_at,
              }

          class Handler(BaseHTTPRequestHandler):
              def send_json(self, status, payload):
                  body = json.dumps(payload, ensure_ascii=False, indent=2).encode('utf-8')
                  self.send_response(status)
                  self.send_header('Content-Type', 'application/json; charset=utf-8')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_GET(self):
                  if not hmac.compare_digest(self.headers.get('X-Proof-Token', ''), TOKEN):
                      self.send_json(403, {'error':'forbidden'}); return
                  if self.path == '/health':
                      self.send_json(200, {'status':'ok','model_invocation':'none'}); return
                  if self.path == '/proof':
                      try:
                          self.send_json(200, run_proof())
                      except Exception as exc:
                          self.send_json(500, {'ISOLATED_LUTO_AXIS_FEEDBACK_CLEAN':'FAILURE','error':type(exc).__name__,'message':str(exc)})
                      return
                  self.send_json(404, {'error':'not_found'})
              def log_message(self, format, *args):
                  return

          ThreadingHTTPServer(('0.0.0.0', int(os.environ.get('PORT','8080'))), Handler).serve_forever()
          PY

          proof_b64="$(base64 -w0 /tmp/proof_service.py)"
          gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet >/dev/null 2>&1 || true
          gcloud run deploy "${PROOF_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --image="${pinned_image}" \
            --service-account="${RUNTIME_SA}" \
            --command=python \
            --args=-c,"import base64;import os;exec(base64.b64decode(os.environ['PROOF_SCRIPT_B64']))" \
            --cpu=4 --memory=8Gi --concurrency=1 --max-instances=1 --min-instances=0 --timeout=3600 \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},HEFESTO_GCS_BUCKET=${BUCKET},PROOF_CANONICAL_RUN_ID=${CANONICAL_RUN_ID},PROOF_ORIGINAL_AXIS_ID=${ORIGINAL_AXIS_ID},PROOF_CLONE_RUN_ID=${CLONE_RUN_ID},PROOF_CLONE_AXIS_ID=${CLONE_AXIS_ID},PROOF_CLONE_REQUEST_FINGERPRINT=${CLONE_REQUEST_FINGERPRINT},PROOF_SCRIPT_B64=${proof_b64},PROOF_TOKEN=${proof_token}" \
            --quiet
          proof_url="$(gcloud run services describe "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')"
          echo "PROOF_URL=${proof_url}" >> "${GITHUB_ENV}"
          echo "PROOF_TOKEN=${proof_token}" >> "${GITHUB_ENV}"

      - name: Run exactly one isolated paid feedback reaction
        run: |
          set -euo pipefail
          health="$(curl -fsS -H "X-Proof-Token: ${PROOF_TOKEN}" "${PROOF_URL}/health")"
          test "$(printf '%s' "${health}" | jq -r '.model_invocation')" = none
          curl -fsS --max-time 3550 -H "X-Proof-Token: ${PROOF_TOKEN}" "${PROOF_URL}/proof" | tee /tmp/result.json
          test "$(jq -r '.ISOLATED_LUTO_AXIS_FEEDBACK_CLEAN' /tmp/result.json)" = SUCCESS
          test "$(jq -r '.search_performed' /tmp/result.json)" = false
          test "$(jq -r '.editorial_project_created' /tmp/result.json)" = false
          test "$(jq -r '.human_approval_required' /tmp/result.json)" = true

      - name: Persist proof result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encoded="$(base64 -w0 /tmp/result.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${RESULT_PATH}" \
            -f message='Persist isolated clean luto Axis feedback result [no-deploy]' \
            -f content="${encoded}" >/dev/null

      - name: Cleanup temporary service
        if: always()
        run: |
          gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet || true
