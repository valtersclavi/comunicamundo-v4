name: one-shot-clean-axis-proof
on:
  push:
    branches:
      - main
permissions:
  contents: read
  id-token: write
concurrency:
  group: hefesto-v4-rebuild-real-plan
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  REQUEST_URI: gs://comunicamundo-v4-hefesto-30524898837/requests/13101c35-723d-43fe-9b45-0082b49c0a76.json
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
jobs:
  plan-once:
    if: ${{ contains(github.event.head_commit.message, '[plan-proof]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Dispatch exactly one real plan
        run: |
          set -euo pipefail
          execution="$(gcloud run jobs execute "${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --args="plan,--request,${REQUEST_URI}" \
            --async \
            --format='value(metadata.name)')"
          test -n "${execution}"
          case "${execution}" in
            hefesto-v4-rebuild-*) ;;
            *) echo "unexpected execution name: ${execution}" >&2; exit 1 ;;
          esac
          echo "EXECUTION=${execution}" >> "${GITHUB_ENV}"
          echo "Dispatched ${execution}"
      - name: Wait for this execution only
        run: |
          set -euo pipefail
          terminal=""
          for attempt in $(seq 1 90); do
            json="$(gcloud run jobs executions describe "${EXECUTION}" --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
            failed="$(printf '%s' "${json}" | jq -r '.status.failedCount // 0')"
            succeeded="$(printf '%s' "${json}" | jq -r '.status.succeededCount // 0')"
            completion="$(printf '%s' "${json}" | jq -r '.status.completionTime // empty')"
            if [ "${failed}" != "0" ]; then
              terminal="failed"
              break
            fi
            if [ "${succeeded}" != "0" ] && [ -n "${completion}" ]; then
              terminal="succeeded"
              break
            fi
            sleep 10
          done
          if [ "${terminal}" != "succeeded" ]; then
            echo "PLAN_EXECUTION: ${terminal:-timeout}" >&2
            gcloud logging read \
              "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND labels.\"run.googleapis.com/execution_name\"=${EXECUTION}" \
              --project="${PROJECT_ID}" --limit=80 --freshness=1h --format='value(textPayload)' || true
            exit 1
          fi
          echo "PLAN_EXECUTION: SUCCEEDED"
      - name: Read only the resulting approval object
        run: |
          set -euo pipefail
          sleep 3
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND labels.\"run.googleapis.com/execution_name\"=${EXECUTION}" \
            --project="${PROJECT_ID}" --limit=100 --freshness=1h --order=asc --format='value(textPayload)' > "${RUNNER_TEMP}/plan.log"
          python - "${RUNNER_TEMP}/plan.log" "${GITHUB_STEP_SUMMARY}" <<'PY'
          import json
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          result = None
          for raw in lines:
              line = raw.strip()
              if not line.startswith("{"):
                  continue
              try:
                  candidate = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(candidate, dict) and isinstance(candidate.get("narrative_axis"), dict):
                  result = candidate
          if result is None:
              raise SystemExit("worker result JSON with narrative_axis was not found")

          axis = result["narrative_axis"]
          if axis.get("status") != "proposed":
              raise SystemExit(f"Narrative Axis did not stop proposed: {axis.get('status')}")
          if result.get("editorial_project_id") is not None:
              raise SystemExit("Editorial Project was created before Axis approval")
          statement = str(axis.get("statement") or "").strip()
          if not statement:
              raise SystemExit("Narrative Axis statement is empty")
          artifact = result.get("graph_artifact") or {}
          prefix = str(artifact.get("prefix") or "")
          if not prefix.startswith("comunicamundo-v4-rebuild/projects/"):
              raise SystemExit(f"graph artifact did not use rebuild namespace: {prefix}")

          summary = Path(sys.argv[2])
          with summary.open("a", encoding="utf-8") as out:
              out.write("# FIRST CLEAN NARRATIVE AXIS: PASS\n\n")
              out.write(f"- Execution: `{__import__('os').environ['EXECUTION']}`\n")
              out.write(f"- Narrative Axis ID: `{axis['narrative_axis_id']}`\n")
              out.write(f"- Project ID: `{axis['project_id']}`\n")
              out.write("- Status: `proposed`\n")
              out.write("- Editorial Project: `NOT CREATED`\n")
              out.write(f"- Fresh graph prefix: `{prefix}`\n\n")
              out.write("## Eixo Narrativo\n\n")
              out.write(statement + "\n")
          print("FIRST_CLEAN_NARRATIVE_AXIS: PASS")
          print(f"NARRATIVE_AXIS_ID={axis['narrative_axis_id']}")
          print(f"NARRATIVE_AXIS={statement}")
          PY
