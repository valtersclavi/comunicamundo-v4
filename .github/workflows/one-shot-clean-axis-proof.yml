name: one-shot-clean-axis-proof
on:
  push:
    branches:
      - main
permissions:
  contents: read
  id-token: write
concurrency:
  group: hefesto-v4-rebuild-real-plan
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  REQUEST_URI: gs://comunicamundo-v4-hefesto-30524898837/requests/13101c35-723d-43fe-9b45-0082b49c0a76.json
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
jobs:
  plan-once:
    if: ${{ contains(github.event.head_commit.message, '[plan-proof]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Dispatch exactly one real plan
        run: |
          set -euo pipefail
          execution="$(gcloud run jobs execute "${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --args="plan,--request,${REQUEST_URI}" \
            --async \
            --format='value(metadata.name)')"
          test -n "${execution}"
          case "${execution}" in
            hefesto-v4-rebuild-*) ;;
            *) echo "unexpected execution name: ${execution}" >&2; exit 1 ;;
          esac
          echo "EXECUTION=${execution}" >> "${GITHUB_ENV}"
          echo "Dispatched ${execution}"
      - name: Wait for this execution only
        run: |
          set -euo pipefail
          terminal=""
          for attempt in $(seq 1 90); do
            json="$(gcloud run jobs executions describe "${EXECUTION}" --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
            failed="$(printf '%s' "${json}" | jq -r '.status.failedCount // 0')"
            succeeded="$(printf '%s' "${json}" | jq -r '.status.succeededCount // 0')"
            completion="$(printf '%s' "${json}" | jq -r '.status.completionTime // empty')"
            if [ "${failed}" != "0" ]; then
              terminal="failed"
              break
            fi
            if [ "${succeeded}" != "0" ] && [ -n "${completion}" ]; then
              terminal="succeeded"
              break
            fi
            sleep 10
          done
          if [ "${terminal}" != "succeeded" ]; then
            echo "PLAN_EXECUTION: ${terminal:-timeout}" >&2
            gcloud run jobs executions describe "${EXECUTION}" \
              --project="${PROJECT_ID}" --region="${REGION}" --format='yaml(status)' || true
            exit 1
          fi
          echo "PLAN_EXECUTION: SUCCEEDED"
      - name: Result
        if: always()
        run: |
          {
            echo "# Atomic real plan proof"
            echo "- Execution: \`${EXECUTION:-NOT_DISPATCHED}\`"
            echo "- Scope: plan only"
            echo "- Approval command: none"
            echo "- Cloud Logging read: none"
          } >> "${GITHUB_STEP_SUMMARY}"
