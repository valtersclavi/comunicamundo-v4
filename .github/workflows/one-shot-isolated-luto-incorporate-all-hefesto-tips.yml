name: one-shot-isolated-luto-incorporate-all-hefesto-tips
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
concurrency:
  group: hefesto-v4-isolated-luto-incorporate-all-hefesto-tips
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  PROOF_SERVICE: hefesto-v4-isolated-luto-all-tips
  BUCKET: comunicamundo-v4-hefesto-30524898837
  PLANNING_RUN_ID: cef3b6a8-cf58-4eb9-80af-ea3b0cec08cb
  ORIGINAL_PROJECT_ID: 01266775-9983-4dcb-a186-857182a3f99d
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  RUNTIME_SA: hefesto-v4-sa@comunicamundo-v4.iam.gserviceaccount.com
  RESULT_PATH: .github/proof-results/isolated-luto-incorporate-all-hefesto-tips-2026-08-29.json
jobs:
  incorporate-all:
    if: ${{ contains(github.event.head_commit.message, '[isolated-luto-incorporate-all-hefesto-tips]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy temporary proof service from deployed Hefesto image
        run: |
          set -euo pipefail
          pinned_image="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          test -n "${pinned_image}"
          deployed_sa="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.serviceAccountName)')"
          test "${deployed_sa}" = "${RUNTIME_SA}"
          proof_token="$(openssl rand -hex 32)"

          cat > /tmp/proof_service.py <<'PY'
          import asyncio
          import hmac
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from uuid import UUID

          from comunicamundo_v4.hefesto.contracts import EditorialProjectStatus, PlanningRunState
          from comunicamundo_v4.hefesto.worker import _application, _planning_persistence

          TOKEN = os.environ['PROOF_TOKEN']
          RUN_ID = UUID(os.environ['PROOF_PLANNING_RUN_ID'])
          ORIGINAL_PROJECT_ID = UUID(os.environ['PROOF_ORIGINAL_PROJECT_ID'])

          def run_proof():
              persistence = _planning_persistence()
              run_before = persistence.get_run(RUN_ID)
              original_before = persistence.get_project(ORIGINAL_PROJECT_ID)
              assert run_before is not None
              assert original_before is not None
              assert run_before.state is PlanningRunState.PROJECT_PROPOSED
              assert run_before.artifacts.editorial_project_id == ORIGINAL_PROJECT_ID
              assert run_before.artifacts.editorial_project_uri
              assert original_before.editorial_project.status is EditorialProjectStatus.PROPOSED
              assert original_before.editorial_project.brief.duration_minutes == 8
              selected_tips = list(original_before.editorial_project.llm_subjects)
              assert len(selected_tips) == 6, selected_tips

              original_uri = run_before.artifacts.editorial_project_uri
              original_durable_before = persistence.load_editorial_project(original_uri)
              assert original_durable_before.editorial_project.editorial_project_id == ORIGINAL_PROJECT_ID

              graph_artifact_before = run_before.artifacts.graph_artifact_id
              understanding_uri_before = run_before.artifacts.understanding_uri
              axis_id_before = run_before.artifacts.narrative_axis_id
              axis_uri_before = run_before.artifacts.narrative_axis_uri

              app = _application()
              saved = asyncio.run(app.incorporate_hefesto_tips(ORIGINAL_PROJECT_ID, None))
              revised_id = saved.editorial_project.editorial_project_id
              assert revised_id != ORIGINAL_PROJECT_ID

              run_after = persistence.get_run(RUN_ID)
              original_after = persistence.get_project(ORIGINAL_PROJECT_ID)
              revised_after = persistence.get_project(revised_id)
              assert run_after is not None
              assert original_after is not None
              assert revised_after is not None

              assert original_after.editorial_project.status is EditorialProjectStatus.SUPERSEDED
              assert revised_after.editorial_project.status is EditorialProjectStatus.PROPOSED
              assert revised_after.editorial_project.parent_project_id == ORIGINAL_PROJECT_ID
              assert revised_after.editorial_project.brief.duration_minutes > 8
              assert revised_after.editorial_project.llm_subjects == []

              assert run_after.state is PlanningRunState.PROJECT_PROPOSED
              assert run_after.artifacts.editorial_project_id == revised_id
              assert run_after.artifacts.editorial_project_uri
              assert run_after.artifacts.editorial_project_uri != original_uri
              assert f'editorial-projects/{revised_id}.json' in run_after.artifacts.editorial_project_uri

              assert run_after.artifacts.graph_artifact_id == graph_artifact_before
              assert run_after.artifacts.understanding_uri == understanding_uri_before
              assert run_after.artifacts.narrative_axis_id == axis_id_before
              assert run_after.artifacts.narrative_axis_uri == axis_uri_before

              revised_durable = persistence.load_editorial_project(run_after.artifacts.editorial_project_uri)
              assert revised_durable.editorial_project.editorial_project_id == revised_id
              assert revised_durable.planning_run_id == RUN_ID
              original_durable_after = persistence.load_editorial_project(original_uri)
              assert original_durable_after.editorial_project.editorial_project_id == ORIGINAL_PROJECT_ID

              return {
                  'ISOLATED_LUTO_INCORPORATE_ALL_HEFESTO_TIPS': 'SUCCESS',
                  'planning_run_id': str(RUN_ID),
                  'original_project_id': str(ORIGINAL_PROJECT_ID),
                  'revised_project_id': str(revised_id),
                  'selected_tips': selected_tips,
                  'duration_before_minutes': original_before.editorial_project.brief.duration_minutes,
                  'duration_after_minutes': revised_after.editorial_project.brief.duration_minutes,
                  'original_project_status_after': original_after.editorial_project.status.value,
                  'revised_project_status': revised_after.editorial_project.status.value,
                  'parent_project_id': str(revised_after.editorial_project.parent_project_id),
                  'remaining_hefesto_tips': revised_after.editorial_project.llm_subjects,
                  'original_editorial_project_uri': original_uri,
                  'revised_editorial_project_uri': run_after.artifacts.editorial_project_uri,
                  'original_artifact_preserved': True,
                  'graph_rebuilt': False,
                  'understanding_rebuilt': False,
                  'axis_changed': False,
                  'search_performed': False,
                  'human_approval_required': True,
                  'article_created': False,
                  'stopped_at': run_after.state.value,
                  'editorial_project': revised_after.editorial_project.model_dump(mode='json'),
                  'planning_run': run_after.model_dump(mode='json'),
              }

          class Handler(BaseHTTPRequestHandler):
              def send_json(self, status, payload):
                  body = json.dumps(payload, ensure_ascii=False, indent=2).encode('utf-8')
                  self.send_response(status)
                  self.send_header('Content-Type', 'application/json; charset=utf-8')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if not hmac.compare_digest(self.headers.get('X-Proof-Token', ''), TOKEN):
                      self.send_json(403, {'error': 'forbidden'})
                      return
                  if self.path == '/health':
                      self.send_json(200, {'status': 'ok', 'model_invocation': 'none'})
                      return
                  if self.path == '/proof':
                      try:
                          self.send_json(200, run_proof())
                      except Exception as exc:
                          self.send_json(500, {
                              'ISOLATED_LUTO_INCORPORATE_ALL_HEFESTO_TIPS': 'FAILURE',
                              'error': type(exc).__name__,
                              'message': str(exc),
                          })
                      return
                  self.send_json(404, {'error': 'not_found'})

              def log_message(self, format, *args):
                  return

          ThreadingHTTPServer(('0.0.0.0', int(os.environ.get('PORT', '8080'))), Handler).serve_forever()
          PY

          proof_b64="$(base64 -w0 /tmp/proof_service.py)"
          gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet >/dev/null 2>&1 || true
          gcloud run deploy "${PROOF_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --image="${pinned_image}" \
            --service-account="${RUNTIME_SA}" \
            --command=python \
            --args=-c,"import base64;import os;exec(base64.b64decode(os.environ['PROOF_SCRIPT_B64']))" \
            --cpu=4 --memory=8Gi --concurrency=1 --max-instances=1 --min-instances=0 --timeout=3600 \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},HEFESTO_GCS_BUCKET=${BUCKET},PROOF_PLANNING_RUN_ID=${PLANNING_RUN_ID},PROOF_ORIGINAL_PROJECT_ID=${ORIGINAL_PROJECT_ID},PROOF_SCRIPT_B64=${proof_b64},PROOF_TOKEN=${proof_token}" \
            --quiet
          echo "PINNED_IMAGE=${pinned_image}" >> "${GITHUB_ENV}"
          echo "PROOF_URL=$(gcloud run services describe "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')" >> "${GITHUB_ENV}"
          echo "PROOF_TOKEN=${proof_token}" >> "${GITHUB_ENV}"

      - name: Incorporate all six Hefesto tips exactly once
        run: |
          set -euo pipefail
          health="$(curl -fsS -H "X-Proof-Token: ${PROOF_TOKEN}" "${PROOF_URL}/health")"
          test "$(printf '%s' "${health}" | jq -r '.model_invocation')" = none
          http_code="$(curl -sS --max-time 3550 -o /tmp/result.json -w '%{http_code}' -H "X-Proof-Token: ${PROOF_TOKEN}" "${PROOF_URL}/proof")"
          cat /tmp/result.json
          test "${http_code}" = 200
          test "$(jq -r '.ISOLATED_LUTO_INCORPORATE_ALL_HEFESTO_TIPS' /tmp/result.json)" = SUCCESS
          test "$(jq -r '.selected_tips | length' /tmp/result.json)" = 6
          test "$(jq -r '.remaining_hefesto_tips | length' /tmp/result.json)" = 0
          test "$(jq -r '.duration_after_minutes > .duration_before_minutes' /tmp/result.json)" = true
          test "$(jq -r '.human_approval_required' /tmp/result.json)" = true
          test "$(jq -r '.article_created' /tmp/result.json)" = false
          test "$(jq -r '.stopped_at' /tmp/result.json)" = project_proposed

      - name: Persist result whether success or failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/result.json ]; then
            printf '%s\n' '{"ISOLATED_LUTO_INCORPORATE_ALL_HEFESTO_TIPS":"FAILURE","message":"workflow failed before proof response"}' > /tmp/result.json
          fi
          encoded="$(base64 -w0 /tmp/result.json)"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${RESULT_PATH}" --jq '.sha' 2>/dev/null || true)"
          if [ -n "${sha}" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${RESULT_PATH}" -f message='Persist isolated luto all-Hefesto-tips result [no-deploy]' -f content="${encoded}" -f sha="${sha}" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${RESULT_PATH}" -f message='Persist isolated luto all-Hefesto-tips result [no-deploy]' -f content="${encoded}" >/dev/null
          fi

      - name: Cleanup temporary service
        if: always()
        run: |
          gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet || true
