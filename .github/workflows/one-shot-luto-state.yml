name: one-shot-luto-state
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hefesto-v4-luto-state
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  STATE_SERVICE: hefesto-v4-luto-state
  BUCKET: comunicamundo-v4-hefesto-30524898837
  REQUEST_URI: gs://comunicamundo-v4-hefesto-30524898837/requests/13101c35-723d-43fe-9b45-0082b49c0a76.json
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  RUNTIME_SA: hefesto-v4-sa@comunicamundo-v4.iam.gserviceaccount.com
jobs:
  read-state:
    if: ${{ contains(github.event.head_commit.message, '[luto-state]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Prepare temporary state service
        run: |
          set -euo pipefail
          image="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          token="$(openssl rand -hex 32)"
          cat > /tmp/state_service.py <<'PY'
          import hmac
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from comunicamundo_v4.hefesto.worker import run_plan_command
          from comunicamundo_v4.hefesto.persistence import GcpEditorialPersistence, GcpPersistenceSettings

          PROJECT = os.environ['GOOGLE_CLOUD_PROJECT']
          BUCKET = os.environ['HEFESTO_GCS_BUCKET']
          REQUEST_URI = os.environ['PROOF_REQUEST_URI']
          TOKEN = os.environ['PROOF_TOKEN']

          def read_state():
              run = run_plan_command(REQUEST_URI)
              p = GcpEditorialPersistence.from_settings(GcpPersistenceSettings(project=PROJECT, bucket=BUCKET))
              lineage = p.repository.get_source_lineage(run.source_lineage_id)
              out = {
                  'planning_run_id': str(run.planning_run_id),
                  'planning_state': run.state.value,
                  'planning_error': run.error,
                  'planning_artifacts': run.artifacts.model_dump(mode='json'),
                  'source_lineage_id': str(run.source_lineage_id),
                  'lineage_state': lineage.state.value if lineage else None,
                  'chunk_count': lineage.chunk_count if lineage else None,
                  'extracted_count': lineage.extracted_count if lineage else None,
                  'failed_count': lineage.failed_count if lineage else None,
                  'graph_extractions_manifest_uri': lineage.graph_extractions_manifest_uri if lineage else None,
                  'graph_manifest_uri': lineage.graph_manifest_uri if lineage else None,
                  'graph_artifact_id': str(lineage.graph_artifact_id) if lineage and lineage.graph_artifact_id else None,
                  'understanding_present': bool(run.artifacts.understanding_uri),
                  'axis_present': bool(run.artifacts.narrative_axis_uri),
              }
              if lineage and lineage.graph_extractions_manifest_uri:
                  m = p.load_graph_extraction_manifest(lineage.graph_extractions_manifest_uri)
                  out['extraction_manifest'] = {
                      'chunk_count': m.chunk_count,
                      'extracted_count': m.extracted_count,
                      'failed_count': m.failed_count,
                      'model': m.model,
                      'entries': [
                          {'chunk_id': e.chunk_id, 'status': e.status.value, 'error': e.error, 'has_extraction': bool(e.extraction_uri)}
                          for e in m.entries
                      ],
                  }
              return out

          class Handler(BaseHTTPRequestHandler):
              def _write(self, status, payload):
                  body = json.dumps(payload, ensure_ascii=False).encode('utf-8')
                  self.send_response(status)
                  self.send_header('Content-Type', 'application/json; charset=utf-8')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_GET(self):
                  if not hmac.compare_digest(self.headers.get('X-Proof-Token', ''), TOKEN):
                      self._write(403, {'error':'forbidden'}); return
                  if self.path == '/health':
                      self._write(200, {'status':'ok','model_invocation':'none'}); return
                  if self.path != '/state':
                      self._write(404, {'error':'not_found'}); return
                  try:
                      self._write(200, read_state())
                  except Exception as exc:
                      self._write(500, {'error':type(exc).__name__, 'message':str(exc)})
              def log_message(self, format, *args):
                  return
          ThreadingHTTPServer(('0.0.0.0', int(os.environ.get('PORT','8080'))), Handler).serve_forever()
          PY
          script="$(base64 -w0 /tmp/state_service.py)"
          gcloud run services delete "${STATE_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet >/dev/null 2>&1 || true
          gcloud run deploy "${STATE_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --image="${image}" \
            --service-account="${RUNTIME_SA}" --command=python \
            --args=-c,"import base64,os;exec(base64.b64decode(os.environ['PROOF_SCRIPT_B64']))" \
            --cpu=4 --memory=8Gi --concurrency=1 --max-instances=1 --min-instances=0 --timeout=600 \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},HEFESTO_GCS_BUCKET=${BUCKET},PROOF_REQUEST_URI=${REQUEST_URI},PROOF_SCRIPT_B64=${script},PROOF_TOKEN=${token}" \
            --quiet
          url="$(gcloud run services describe "${STATE_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')"
          echo "STATE_URL=${url}" >> "${GITHUB_ENV}"
          echo "STATE_TOKEN=${token}" >> "${GITHUB_ENV}"
      - name: Read durable state
        run: |
          set -euo pipefail
          health="$(curl -fsS -H "X-Proof-Token: ${STATE_TOKEN}" "${STATE_URL}/health")"
          test "$(printf '%s' "${health}" | jq -r '.status')" = "ok"
          curl -fsS -H "X-Proof-Token: ${STATE_TOKEN}" "${STATE_URL}/state" | tee /tmp/luto-state.json
          jq . /tmp/luto-state.json
      - name: Result
        if: always()
        run: |
          if [ -f /tmp/luto-state.json ]; then
            echo '```json' >> "${GITHUB_STEP_SUMMARY}"
            jq . /tmp/luto-state.json >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Cleanup
        if: always()
        run: gcloud run services delete "${STATE_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet || true
