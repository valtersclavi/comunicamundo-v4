name: rebuild-ci
on:
  push:
    branches:
      - rebuild/hefesto-v4-from-initial-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.14"
      - name: Install clean rebuild
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Test and compile
        run: |
          set -euo pipefail
          pytest
          python -m compileall -q src tests
