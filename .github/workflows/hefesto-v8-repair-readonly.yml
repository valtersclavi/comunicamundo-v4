name: Hefesto V8 repair diagnosis SELECT only
on:
  push:
    branches: [main]
    paths: [.github/workflows/hefesto-v8-repair-readonly.yml]
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: comunicamundo-v4
          workload_identity_provider: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
          service_account: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: SELECT-only repair diagnosis
        run: |
          set -euo pipefail
          temporary="hefesto-v8-repair-${GITHUB_RUN_ID}"
          trap 'gcloud run jobs delete "${temporary}" --project=comunicamundo-v4 --region=us-central1 --quiet' EXIT
          image="$(gcloud run jobs describe hefesto-v4-rebuild --project=comunicamundo-v4 --region=us-central1 --format='value(spec.template.spec.template.spec.containers[0].image)')"
          script="$(cat <<'PYTHON'
          import base64, hashlib, json, os, zlib
          import psycopg
          project_id = "bb30b7e6-b8b2-525a-933e-573b184f672c"
          result = {"read_only": True, "model_calls": 0, "project_id": project_id, "projects": []}
          with psycopg.connect(os.environ["HEFESTO_POSTGRES_DIRECT_URL"], autocommit=True) as db:
              db.execute("BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY")
              db.execute("SET LOCAL statement_timeout = '30s'")
              db.execute("SET LOCAL lock_timeout = '5s'")
              assert db.execute("SHOW transaction_read_only").fetchone()[0] == "on"
              rows = db.execute(
                  """SELECT execution_id, status, updated_at, payload
                     FROM hefesto_product.v8_projects
                     WHERE payload->'request'->>'project_id' = %s
                        OR execution_id::text = %s
                     ORDER BY updated_at DESC""",
                  (project_id, project_id),
              ).fetchall()
              for eid, status, updated, state in rows:
                  work = state.get("work") or {}
                  project = {
                      "execution_id": str(eid),
                      "project_id": (state.get("request") or {}).get("project_id"),
                      "status": status,
                      "updated_at": str(updated),
                      "error": state.get("error"),
                      "action": state.get("action"),
                      "revision": state.get("revision"),
                      "state_keys": list(state),
                      "completed_actions": state.get("completed_actions"),
                      "editorial_stages": state.get("editorial_stages"),
                      "review_checkpoint": state.get("review_checkpoint"),
                      "writing_checkpoint": {
                          k: v for k, v in (state.get("writing_checkpoint") or {}).items()
                          if k not in {"body", "text"}
                      },
                      "work_title": work.get("title"),
                      "work_characters": len(work.get("body") or ""),
                      "work_words": len((work.get("body") or "").split()),
                      "telemetry_tail": (state.get("telemetry") or [])[-12:],
                      "operations": [],
                  }
                  for key, journal in db.execute(
                      """SELECT operation_key, payload
                         FROM hefesto_product.v8_operations
                         WHERE execution_id = %s
                         ORDER BY updated_at""",
                      (eid,),
                  ).fetchall():
                      attempts = journal.get("attempts") or []
                      project["operations"].append({
                          "key": key,
                          "stage": journal.get("stage"),
                          "complete": journal.get("complete"),
                          "pending": journal.get("pending"),
                          "in_flight": journal.get("in_flight"),
                          "next_mode": journal.get("next_mode"),
                          "parse_error": journal.get("parse_error"),
                          "repair_digest": journal.get("repair_digest"),
                          "errors": journal.get("errors"),
                          "attempt_count": len(attempts),
                          "attempts": [{
                              "mode": a.get("mode"),
                              "finish": a.get("finish"),
                              "stage": a.get("stage"),
                              "text_len": len(a.get("text") or ""),
                              "usage": a.get("usage"),
                          } for a in attempts],
                          "assembled_len": len(journal.get("assembled") or ""),
                          "keys": list(journal),
                          # Include full journal only for failed/incomplete repair cases.
                          "journal": journal if (
                              journal.get("parse_error")
                              or journal.get("repair_digest")
                              or journal.get("errors")
                              or not journal.get("complete")
                          ) else None,
                      })
                  result["projects"].append(project)
              db.rollback()
          raw = json.dumps(result, ensure_ascii=False, default=str).encode()
          encoded = base64.b64encode(zlib.compress(raw)).decode()
          chunks = [encoded[i:i + 1500] for i in range(0, len(encoded), 1500)]
          print("HEFESTO_DIAG_META " + json.dumps({
              "chunks": len(chunks),
              "sha256": hashlib.sha256(raw).hexdigest(),
              "projects": len(result["projects"]),
              "bytes": len(raw),
          }), flush=True)
          for i, chunk in enumerate(chunks):
              print("HEFESTO_DIAG_PART " + json.dumps({"index": i, "data": chunk}), flush=True)
          PYTHON
          )"
          gcloud run jobs deploy "${temporary}" --project=comunicamundo-v4 --region=us-central1 --image="${image}" --service-account=hefesto-v4-sa@comunicamundo-v4.iam.gserviceaccount.com --command=python --args="^@@^-c@@${script}" --set-secrets="HEFESTO_POSTGRES_DIRECT_URL=hefesto-postgres-direct-url:latest" --cpu=1 --memory=512Mi --task-timeout=300s --max-retries=0 --quiet
          gcloud run jobs execute "${temporary}" --project=comunicamundo-v4 --region=us-central1 --wait
          gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${temporary}\"" --project=comunicamundo-v4 --limit=5000 --format='value(textPayload)' > "${RUNNER_TEMP}/repair-diagnostic.txt"
          cat "${RUNNER_TEMP}/repair-diagnostic.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hefesto-v8-repair-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/repair-diagnostic.txt
          retention-days: 7
