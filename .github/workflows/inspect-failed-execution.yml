name: inspect-failed-execution
on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  BUCKET: comunicamundo-v4-hefesto-30524898837
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  CANARY_URI: gs://comunicamundo-v4-hefesto-30524898837/calibracao/hefesto-v2/canary-20260901T135723Z-4e32c17d-0af8-4f8f-840e-8a2454a0a81b/request.json
  TEST_A_PLAN_EXECUTION: hefesto-v4-rebuild-zvv78
  TOKENS_PER_MINUTE: "1000000"

jobs:
  operate-v2-test-a:
    if: ${{ contains(github.event.head_commit.message, '[hefesto-v2-test-a]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Run paid canary and Test A
        shell: bash
        run: |
          set -Eeuo pipefail

          RESULT=/tmp/hefesto-v2-test-a-result.json
          stage=bootstrap
          jq -n '{status:"running",stage:"bootstrap"}' > "${RESULT}"

          on_error() {
            rc=$?
            trap - ERR
            jq --arg stage "${stage}" --argjson exit_code "${rc}"               '.status="failure" | .stage=$stage | .exit_code=$exit_code'               "${RESULT}" > "${RESULT}.tmp" || true
            if [ -s "${RESULT}.tmp" ]; then mv "${RESULT}.tmp" "${RESULT}"; fi
            exit "${rc}"
          }
          trap on_error ERR

          set_stage() {
            stage="$1"
            jq --arg stage "${stage}" '.stage=$stage' "${RESULT}" > "${RESULT}.tmp"
            mv "${RESULT}.tmp" "${RESULT}"
          }

          execute_job() {
            local args="$1"
            gcloud run jobs execute "${JOB_NAME}"               --project="${PROJECT_ID}"               --region="${REGION}"               --args="${args}"               --wait               --quiet               --format='value(metadata.name)'
          }

          snapshot_plans() {
            local project_id="$1"
            gcloud storage ls               "gs://${BUCKET}/comunicamundo-v4-rebuild/projects/${project_id}/executions/*/digestion/plan.json"               2>/dev/null | sed '/^$/d' | sort -u || true
          }

          discover_new_run() {
            local before_file="$1"
            local project_id="$2"
            local after_file
            after_file="$(mktemp)"
            snapshot_plans "${project_id}" > "${after_file}"
            local plan_uri
            plan_uri="$(comm -13 "${before_file}" "${after_file}" | tail -1)"
            test -n "${plan_uri}"
            printf '%s' "${plan_uri}" | sed -E 's#^.*/executions/([^/]+)/digestion/plan[.]json$#\1#'
          }

          pinned_image="$(gcloud run jobs describe "${JOB_NAME}"             --project="${PROJECT_ID}" --region="${REGION}"             --format='value(spec.template.spec.template.spec.containers[0].image)')"
          test -n "${pinned_image}"

          set_stage canary_validate
          gcloud storage cat "${CANARY_URI}" > /tmp/canary-request.json
          canary_project_id="$(jq -r '.project_id' /tmp/canary-request.json)"
          test "${canary_project_id}" = "4e32c17d-0af8-4f8f-840e-8a2454a0a81b"
          snapshot_plans "${canary_project_id}" > /tmp/canary-before.txt

          set_stage canary_digest
          canary_cloud_execution="$(execute_job "digest-v2,--request=${CANARY_URI},--tokens-per-minute=${TOKENS_PER_MINUTE},--max-concurrency=1,--per-project-concurrency=1")"
          canary_run_id="$(discover_new_run /tmp/canary-before.txt "${canary_project_id}")"
          canary_base="gs://${BUCKET}/comunicamundo-v4-rebuild/projects/${canary_project_id}/executions/${canary_run_id}"
          gcloud storage ls "${canary_base}/digestion/evidence-matrix.json" >/dev/null
          gcloud storage ls "${canary_base}/digestion/editorial-understanding.json" >/dev/null

          jq --arg execution "${canary_cloud_execution}" --arg run_id "${canary_run_id}"             '.canary={status:"success",cloud_run_execution:$execution,execution_run_id:$run_id}'             "${RESULT}" > "${RESULT}.tmp"
          mv "${RESULT}.tmp" "${RESULT}"

          set_stage test_a_resolve_request
          gcloud run jobs executions describe "${TEST_A_PLAN_EXECUTION}"             --project="${PROJECT_ID}" --region="${REGION}" --format=json > /tmp/test-a-plan-execution.json
          test_a_uri="$(jq -r '.. | strings | select(startswith("gs://") and endswith(".json"))'             /tmp/test-a-plan-execution.json | head -1)"
          test -n "${test_a_uri}"
          gcloud storage cat "${test_a_uri}" > /tmp/test-a-request.json

          test_a_project_id="$(jq -r '.project_id' /tmp/test-a-request.json)"
          test "$(jq -r '.sources | length' /tmp/test-a-request.json)" = "4"
          source_lengths="$(jq -c '[.sources[].text | length]' /tmp/test-a-request.json)"
          test "${source_lengths}" = '[121342,35310,67980,12140]'
          test "$(jq -r '.brief.theme' /tmp/test-a-request.json)" =             'O impacto das redes sociais na saúde mental dos adolescentes'
          snapshot_plans "${test_a_project_id}" > /tmp/test-a-before.txt

          set_stage test_a_digest
          digest_execution="$(execute_job "digest-v2,--request=${test_a_uri},--tokens-per-minute=${TOKENS_PER_MINUTE},--max-concurrency=1,--per-project-concurrency=1")"
          test_a_run_id="$(discover_new_run /tmp/test-a-before.txt "${test_a_project_id}")"
          test_a_base="gs://${BUCKET}/comunicamundo-v4-rebuild/projects/${test_a_project_id}/executions/${test_a_run_id}"
          gcloud storage ls "${test_a_base}/digestion/evidence-matrix.json" >/dev/null
          gcloud storage ls "${test_a_base}/digestion/editorial-understanding.json" >/dev/null

          set_stage test_a_propose_axis
          axis_execution="$(execute_job "propose-axis-v2,--execution-run-id=${test_a_run_id},--tokens-per-minute=${TOKENS_PER_MINUTE},--max-concurrency=1,--per-project-concurrency=1")"
          gcloud storage ls "${test_a_base}/editorial/axis/proposed.json" >/dev/null
          gcloud storage ls "${test_a_base}/editorial/axis/evidence-review.json" >/dev/null

          set_stage test_a_approve_axis
          project_execution="$(execute_job "approve-axis-v2,--execution-run-id=${test_a_run_id},--tokens-per-minute=${TOKENS_PER_MINUTE},--max-concurrency=1,--per-project-concurrency=1")"
          gcloud storage ls "${test_a_base}/editorial/axis/approved.json" >/dev/null
          gcloud storage ls "${test_a_base}/editorial/project/proposed.json" >/dev/null
          gcloud storage ls "${test_a_base}/editorial/project/tip-timing.json" >/dev/null

          set_stage test_a_approve_project_without_tips
          approval_execution="$(execute_job "approve-project-v2,--execution-run-id=${test_a_run_id},--without-tips,--tokens-per-minute=${TOKENS_PER_MINUTE},--max-concurrency=1,--per-project-concurrency=1")"
          approved_project_uri="${test_a_base}/editorial/project/approved.json"
          gcloud storage cat "${approved_project_uri}" > /tmp/approved-project.json
          test "$(jq -r '.accepted_tips | length' /tmp/approved-project.json)" = "0"
          test "$(jq -r '.editorial_project.status' /tmp/approved-project.json)" = "approved"

          set_stage test_a_production
          production_execution="$(execute_job "produce-v2,--execution-run-id=${test_a_run_id},--tokens-per-minute=${TOKENS_PER_MINUTE},--max-concurrency=1,--per-project-concurrency=1")"
          final_article_uri="${test_a_base}/production/final-article.json"
          production_record_uri="${test_a_base}/production/production-record.json"
          gcloud storage cat "${final_article_uri}" > /tmp/final-article.json
          gcloud storage cat "${production_record_uri}" > /tmp/production-record.json

          set_stage test_a_report
          usage_before=/tmp/usage-before.txt
          gcloud storage ls "gs://${BUCKET}/comunicamundo-v4-rebuild/projects/${test_a_project_id}/usage/*.json"             2>/dev/null | sort -u > "${usage_before}" || true
          report_execution="$(execute_job "report-v2,--project-id=${test_a_project_id}")"
          usage_after=/tmp/usage-after.txt
          gcloud storage ls "gs://${BUCKET}/comunicamundo-v4-rebuild/projects/${test_a_project_id}/usage/*.json"             2>/dev/null | sort -u > "${usage_after}"
          usage_uri="$(comm -13 "${usage_before}" "${usage_after}" | tail -1)"
          if [ -z "${usage_uri}" ]; then usage_uri="$(tail -1 "${usage_after}")"; fi
          test -n "${usage_uri}"
          gcloud storage cat "${usage_uri}" > /tmp/usage-report.json

          gcloud storage cat "${test_a_base}/editorial/axis/approved.json" > /tmp/axis-approved.json
          gcloud storage cat "${test_a_base}/editorial/project/proposed.json" > /tmp/project-proposed.json

          jq -n             --arg pinned_image "${pinned_image}"             --arg request_uri "${test_a_uri}"             --arg project_id "${test_a_project_id}"             --arg execution_run_id "${test_a_run_id}"             --arg source_lengths "${source_lengths}"             --arg canary_execution "${canary_cloud_execution}"             --arg canary_run_id "${canary_run_id}"             --arg digest_execution "${digest_execution}"             --arg axis_execution "${axis_execution}"             --arg project_execution "${project_execution}"             --arg approval_execution "${approval_execution}"             --arg production_execution "${production_execution}"             --arg report_execution "${report_execution}"             --arg final_article_uri "${final_article_uri}"             --arg production_record_uri "${production_record_uri}"             --arg usage_uri "${usage_uri}"             --slurpfile axis /tmp/axis-approved.json             --slurpfile project_proposed /tmp/project-proposed.json             --slurpfile project_approved /tmp/approved-project.json             --slurpfile final_article /tmp/final-article.json             --slurpfile production_record /tmp/production-record.json             --slurpfile usage /tmp/usage-report.json             '{
              status:"success",
              test:"A",
              test_b_started:false,
              pinned_image:$pinned_image,
              request_uri:$request_uri,
              project_id:$project_id,
              execution_run_id:$execution_run_id,
              source_lengths:($source_lengths|fromjson),
              canary:{status:"success",cloud_run_execution:$canary_execution,execution_run_id:$canary_run_id},
              executions:{
                digest:$digest_execution,
                propose_axis:$axis_execution,
                approve_axis:$project_execution,
                approve_project_without_tips:$approval_execution,
                production:$production_execution,
                report:$report_execution
              },
              artifacts:{
                final_article_uri:$final_article_uri,
                production_record_uri:$production_record_uri,
                usage_report_uri:$usage_uri
              },
              narrative_axis:$axis[0],
              editorial_project_proposed:$project_proposed[0],
              editorial_project_approved:$project_approved[0],
              final_article:$final_article[0],
              production_record:$production_record[0],
              usage_report:$usage[0]
            }' > "${RESULT}"

          jq '{
            status,
            test,
            test_b_started,
            project_id,
            execution_run_id,
            canary,
            executions,
            artifacts,
            accepted_tips:(.editorial_project_approved.accepted_tips | length),
            article_title:.final_article.title,
            article_word_count:.final_article.word_count,
            usage_complete:.usage_report.usage_complete,
            rated_cost_usd:.usage_report.rated_cost_usd
          }' "${RESULT}"

      - name: Upload Test A result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hefesto-v2-test-a-result
          path: /tmp/hefesto-v2-test-a-result.json
          if-no-files-found: error
          retention-days: 30
