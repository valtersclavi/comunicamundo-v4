name: inspect-failed-execution
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  CANARY_URI: gs://comunicamundo-v4-hefesto-30524898837/calibracao/hefesto-v2/canary-20260901T135723Z-4e32c17d-0af8-4f8f-840e-8a2454a0a81b/request.json
  CANARY_PROJECT_ID: 4e32c17d-0af8-4f8f-840e-8a2454a0a81b
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com

jobs:
  canary:
    if: ${{ contains(github.event.head_commit.message, '[run-v2-canary]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Run paid V2 canary
        run: |
          set -euo pipefail
          execution="$(gcloud run jobs execute "${JOB_NAME}"             --project="${PROJECT_ID}" --region="${REGION}"             --args="digest-v2,--request=${CANARY_URI},--tokens-per-minute=1000000,--max-concurrency=1,--per-project-concurrency=1"             --wait --format='value(metadata.name)')"
          echo "CANARY_EXECUTION=${execution}"
      - name: Persist canary usage report
        run: |
          set -euo pipefail
          execution="$(gcloud run jobs execute "${JOB_NAME}"             --project="${PROJECT_ID}" --region="${REGION}"             --args="report-v2,--project-id=${CANARY_PROJECT_ID}"             --wait --format='value(metadata.name)')"
          echo "CANARY_REPORT_EXECUTION=${execution}"
