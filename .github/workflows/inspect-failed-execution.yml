name: inspect-failed-execution
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  EXECUTION: hefesto-v4-rebuild-lsg4k
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
jobs:
  inspect:
    if: ${{ contains(github.event.head_commit.message, '[inspect-v2-canary]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Collect execution and logs
        run: |
          set -euo pipefail
          mkdir -p /tmp/canary-inspect
          gcloud run jobs executions describe "${EXECUTION}"             --project="${PROJECT_ID}" --region="${REGION}" --format=json             | tee /tmp/canary-inspect/execution.json
          filter="resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND labels.\"run.googleapis.com/execution_name\"=${EXECUTION}"
          gcloud logging read "${filter}" --project="${PROJECT_ID}"             --limit=1000 --order=asc --format=json             | tee /tmp/canary-inspect/logs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hefesto-v2-canary-lsg4k
          path: /tmp/canary-inspect
          if-no-files-found: error
