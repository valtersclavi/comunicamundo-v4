name: Resume persisted Hefesto plan
on:
  workflow_dispatch:
    inputs:
      execution_run_id:
        description: Existing execution with persisted sources and completed stages
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      PROJECT_ID: comunicamundo-v4
      REGION: us-central1
      EXECUTION: ${{ inputs.execution_run_id }}
    steps:
      - name: Validate execution ID
        run: '[[ "${EXECUTION}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]'
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
          service_account: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Continue selected and checkpointed plan
        run: |
          gcloud run jobs execute hefesto-v4-rebuild \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --args="resume-plan,--execution-run-id=${EXECUTION}" --wait
