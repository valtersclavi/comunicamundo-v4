name: operate-hefesto
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Product operation
        required: true
        type: choice
        options: [ingest, plan, resume-plan, approve-axis, inspect]
      request_uri:
        description: gs:// manifest URI for ingest or plan
        required: false
        type: string
      request_base64:
        description: Base64 JSON manifest for ingest or plan
        required: false
        type: string
      execution_run_id:
        description: UUID for resume-plan, approve-axis or inspect
        required: false
        type: string
permissions:
  contents: read
  id-token: write
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Execute product operation
        env:
          OPERATION: ${{ inputs.operation }}
          REQUEST_URI: ${{ inputs.request_uri }}
          REQUEST_BASE64: ${{ inputs.request_base64 }}
          EXECUTION_RUN_ID: ${{ inputs.execution_run_id }}
        run: |
          set -euo pipefail
          case "${OPERATION}" in
            ingest|plan)
              if [[ -n "${REQUEST_URI}" && -z "${REQUEST_BASE64}" ]]; then
                args="${OPERATION},--request=${REQUEST_URI}"
              elif [[ -z "${REQUEST_URI}" && -n "${REQUEST_BASE64}" ]]; then
                args="${OPERATION},--request-base64=${REQUEST_BASE64}"
              else
                echo "ingest/plan require exactly one request transport" >&2
                exit 2
              fi
              test -z "${EXECUTION_RUN_ID}"
              ;;
            resume-plan|approve-axis|inspect)
              [[ "${EXECUTION_RUN_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
              test -z "${REQUEST_URI}${REQUEST_BASE64}"
              args="${OPERATION},--execution-run-id=${EXECUTION_RUN_ID}"
              ;;
            *) exit 2 ;;
          esac
          set +e
          gcloud run jobs execute "${JOB_NAME}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --args="${args}" --wait --format='value(metadata.name)' \
            >/tmp/execution.out 2>/tmp/execution.err
          status=$?
          set -e
          cat /tmp/execution.out /tmp/execution.err
          execution="$(tail -1 /tmp/execution.out)"
          if [[ -z "${execution}" ]]; then
            execution="$(sed -n 's/.*executions describe \([^ ]*\).*/\1/p' /tmp/execution.err | tail -1)"
          fi
          test -n "${execution}"
          filter="resource.type=\"cloud_run_job\" AND labels.\"run.googleapis.com/execution_name\"=\"${execution}\""
          gcloud logging read "${filter}" --project="${PROJECT_ID}" \
            --freshness=4h --order=asc --limit=2000 --format=json >/tmp/cloud-logs.json
          jq -r '.[] | .textPayload // empty' /tmp/cloud-logs.json
          receipt="$(jq -c '[.[] | select(.jsonPayload.status? != null) | .jsonPayload] | last // empty' /tmp/cloud-logs.json)"
          test -n "${receipt}"
          {
            echo "# Hefesto operation"
            echo "- Operation: \`${OPERATION}\`"
            echo "- Cloud Run execution: \`${execution}\`"
            echo '```json'
            echo "${receipt}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
