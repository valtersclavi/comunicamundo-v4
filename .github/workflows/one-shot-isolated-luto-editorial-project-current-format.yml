name: one-shot-isolated-luto-editorial-project-current-format
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
concurrency:
  group: hefesto-v4-isolated-luto-editorial-project-current-format
  cancel-in-progress: false
env:
  PROJECT_ID: comunicamundo-v4
  REGION: us-central1
  JOB_NAME: hefesto-v4-rebuild
  PROOF_SERVICE: hefesto-v4-isolated-luto-editorial-project-current-format
  BUCKET: comunicamundo-v4-hefesto-30524898837
  CLONE_RUN_ID: cef3b6a8-cf58-4eb9-80af-ea3b0cec08cb
  APPROVED_AXIS_ID: d2e086ac-1b06-44c6-94ae-a6a1578ad092
  WIF_PROVIDER: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
  DEPLOYER_SA: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
  RUNTIME_SA: hefesto-v4-sa@comunicamundo-v4.iam.gserviceaccount.com
  RESULT_PATH: .github/proof-results/isolated-luto-editorial-project-current-format-2026-08-29.json
jobs:
  propose-project:
    if: ${{ contains(github.event.head_commit.message, '[isolated-luto-editorial-project-current-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy temporary proof service
        run: |
          set -euo pipefail
          pinned_image="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          test -n "${pinned_image}"
          deployed_sa="$(gcloud run jobs describe "${JOB_NAME}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(spec.template.spec.template.spec.serviceAccountName)')"
          test "${deployed_sa}" = "${RUNTIME_SA}"
          proof_token="$(openssl rand -hex 32)"

          cat > /tmp/proof_service.py <<'PY'
          import hmac
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from uuid import UUID

          from comunicamundo_v4.hefesto.contracts import NarrativeAxisStatus, EditorialProjectStatus, PlanningRunState
          from comunicamundo_v4.hefesto.worker import run_approve_axis_command

          TOKEN = os.environ['PROOF_TOKEN']
          RUN_ID = UUID(os.environ['PROOF_CLONE_RUN_ID'])
          AXIS_ID = UUID(os.environ['PROOF_APPROVED_AXIS_ID'])

          def run_proof():
              result = run_approve_axis_command(RUN_ID, AXIS_ID)
              assert result.planning_run.state is PlanningRunState.PROJECT_PROPOSED, result
              assert result.narrative_axis.narrative_axis_id == AXIS_ID, result
              assert result.narrative_axis.status is NarrativeAxisStatus.APPROVED, result
              assert result.editorial_project.status is EditorialProjectStatus.PROPOSED, result
              assert result.human_approval_required is True, result
              assert result.article_created is False, result
              return {
                  'ISOLATED_LUTO_EDITORIAL_PROJECT_CURRENT_FORMAT': 'SUCCESS',
                  'planning_run': result.planning_run.model_dump(mode='json'),
                  'narrative_axis': result.narrative_axis.model_dump(mode='json'),
                  'editorial_project': result.editorial_project.model_dump(mode='json'),
                  'consumed_feedback_decision': None if result.consumed_feedback_decision is None else result.consumed_feedback_decision.model_dump(mode='json'),
                  'carry_forwards': [item.model_dump(mode='json') for item in result.carry_forwards],
                  'human_approval_required': result.human_approval_required,
                  'article_created': result.article_created,
                  'search_performed': getattr(result, 'search_performed', False),
                  'graph_rebuilt': False,
                  'understanding_rebuilt': False,
                  'stopped_at': result.stopped_at,
              }

          class Handler(BaseHTTPRequestHandler):
              def send_json(self, status, payload):
                  body = json.dumps(payload, ensure_ascii=False, indent=2).encode('utf-8')
                  self.send_response(status)
                  self.send_header('Content-Type', 'application/json; charset=utf-8')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def do_GET(self):
                  if not hmac.compare_digest(self.headers.get('X-Proof-Token', ''), TOKEN):
                      self.send_json(403, {'error':'forbidden'}); return
                  if self.path == '/health':
                      self.send_json(200, {'status':'ok','model_invocation':'none'}); return
                  if self.path == '/proof':
                      try:
                          self.send_json(200, run_proof())
                      except Exception as exc:
                          self.send_json(500, {
                              'ISOLATED_LUTO_EDITORIAL_PROJECT_CURRENT_FORMAT':'FAILURE',
                              'error':type(exc).__name__,
                              'message':str(exc),
                          })
                      return
                  self.send_json(404, {'error':'not_found'})
              def log_message(self, format, *args):
                  return

          ThreadingHTTPServer(('0.0.0.0', int(os.environ.get('PORT','8080'))), Handler).serve_forever()
          PY

          proof_b64="$(base64 -w0 /tmp/proof_service.py)"
          gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet >/dev/null 2>&1 || true
          gcloud run deploy "${PROOF_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --image="${pinned_image}" \
            --service-account="${RUNTIME_SA}" \
            --command=python \
            --args=-c,"import base64;import os;exec(base64.b64decode(os.environ['PROOF_SCRIPT_B64']))" \
            --cpu=4 --memory=8Gi --concurrency=1 --max-instances=1 --min-instances=0 --timeout=3600 \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},HEFESTO_GCS_BUCKET=${BUCKET},PROOF_CLONE_RUN_ID=${CLONE_RUN_ID},PROOF_APPROVED_AXIS_ID=${APPROVED_AXIS_ID},PROOF_SCRIPT_B64=${proof_b64},PROOF_TOKEN=${proof_token}" \
            --quiet
          echo "PINNED_IMAGE=${pinned_image}" >> "${GITHUB_ENV}"
          echo "PROOF_URL=$(gcloud run services describe "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')" >> "${GITHUB_ENV}"
          echo "PROOF_TOKEN=${proof_token}" >> "${GITHUB_ENV}"

      - name: Generate exactly one Editorial Project using current format
        run: |
          set -euo pipefail
          health="$(curl -fsS -H "X-Proof-Token: ${PROOF_TOKEN}" "${PROOF_URL}/health")"
          test "$(printf '%s' "${health}" | jq -r '.model_invocation')" = none
          http_code="$(curl -sS --max-time 3550 -o /tmp/result.json -w '%{http_code}' -H "X-Proof-Token: ${PROOF_TOKEN}" "${PROOF_URL}/proof")"
          cat /tmp/result.json
          test "${http_code}" = 200
          test "$(jq -r '.ISOLATED_LUTO_EDITORIAL_PROJECT_CURRENT_FORMAT' /tmp/result.json)" = SUCCESS
          test "$(jq -r '.human_approval_required' /tmp/result.json)" = true
          test "$(jq -r '.article_created' /tmp/result.json)" = false
          test "$(jq -r '.stopped_at' /tmp/result.json)" = project_proposed

      - name: Persist result whether success or failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/result.json ]; then
            printf '%s\n' '{"ISOLATED_LUTO_EDITORIAL_PROJECT_CURRENT_FORMAT":"FAILURE","message":"workflow failed before proof response"}' > /tmp/result.json
          fi
          encoded="$(base64 -w0 /tmp/result.json)"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${RESULT_PATH}" --jq '.sha' 2>/dev/null || true)"
          if [ -n "${sha}" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${RESULT_PATH}" -f message='Persist isolated luto Editorial Project current-format result [no-deploy]' -f content="${encoded}" -f sha="${sha}" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${RESULT_PATH}" -f message='Persist isolated luto Editorial Project current-format result [no-deploy]' -f content="${encoded}" >/dev/null
          fi

      - name: Cleanup temporary service
        if: always()
        run: |
          gcloud run services delete "${PROOF_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --quiet || true
