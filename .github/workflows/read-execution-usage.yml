name: Read Hefesto execution usage
on:
  workflow_dispatch:
    inputs:
      execution_run_id:
        description: Existing execution UUID; read stored receipt only
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_ID: comunicamundo-v4
      BUCKET: comunicamundo-v4-hefesto-30524898837
      EXECUTION_ID: ${{ inputs.execution_run_id }}
    steps:
      - name: Validate execution ID
        run: '[[ "${EXECUTION_ID}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]'
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
          service_account: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read persisted receipt
        shell: bash
        run: |
          gcloud storage cat "gs://${BUCKET}/hefesto-product/executions/${EXECUTION_ID}/receipt.json" > "${RUNNER_TEMP}/receipt.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ["RUNNER_TEMP"]) / "receipt.json").read_text())
          assert receipt["execution_run_id"] == os.environ["EXECUTION_ID"]
          print(json.dumps({
              "execution_run_id": receipt["execution_run_id"],
              "status": receipt.get("status"),
              "usage": receipt.get("usage"),
              "stages": receipt.get("stages"),
          }, ensure_ascii=False, indent=2))
          PY
