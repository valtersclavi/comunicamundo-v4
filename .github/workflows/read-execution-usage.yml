name: Read Hefesto execution usage
on:
  workflow_dispatch:
    inputs:
      execution_run_id:
        description: Existing execution UUID
        required: true
        type: string
      since:
        description: UTC start of bounded Cloud Run log search (ISO 8601)
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_ID: comunicamundo-v4
      EXECUTION_ID: ${{ inputs.execution_run_id }}
      SINCE: ${{ inputs.since }}
    steps:
      - name: Validate and bound log query
        run: |
          python - <<'PY'
          import os, uuid
          from datetime import datetime, timezone
          from pathlib import Path
          execution_id = str(uuid.UUID(os.environ["EXECUTION_ID"]))
          since = datetime.fromisoformat(os.environ["SINCE"].replace("Z", "+00:00"))
          if since.tzinfo is None:
              raise ValueError("since requires a timezone")
          since = since.astimezone(timezone.utc).isoformat().replace("+00:00", "Z")
          query = (
              'resource.type="cloud_run_job" AND '
              'resource.labels.job_name="hefesto-v4-rebuild" AND '
              f'timestamp>="{since}"'
          )
          Path(os.environ["RUNNER_TEMP"], "query.txt").write_text(query)
          PY
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
          service_account: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read matching receipt from Cloud Logging
        shell: bash
        run: |
          gcloud logging read "$(cat "${RUNNER_TEMP}/query.txt")" --project="${PROJECT_ID}" --limit=5000 --format=json > "${RUNNER_TEMP}/logs.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          entries = json.loads((Path(os.environ["RUNNER_TEMP"]) / "logs.json").read_text())
          execution_id = os.environ["EXECUTION_ID"]
          for entry in entries:
              payload = entry.get("textPayload") or entry.get("jsonPayload") or ""
              raw = payload if isinstance(payload, str) else json.dumps(payload, ensure_ascii=False)
              if execution_id not in raw:
                  continue
              try:
                  receipt = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if receipt.get("execution_run_id") != execution_id or not receipt.get("usage"):
                  continue
              print(json.dumps({
                  "execution_run_id": execution_id,
                  "status": receipt.get("status"),
                  "usage": receipt["usage"],
                  "stages": receipt.get("stages"),
              }, ensure_ascii=False, indent=2))
              break
          else:
              raise SystemExit("matching usage receipt not found in the selected log window")
          PY
