name: Read Hefesto execution usage
on:
  workflow_dispatch:
    inputs:
      execution_run_id:
        description: Existing execution UUID; inspection without model calls
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: comunicamundo-v4
      REGION: us-central1
      EXECUTION_ID: ${{ inputs.execution_run_id }}
    steps:
      - name: Validate execution ID
        run: '[[ "${EXECUTION_ID}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]'
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/30524898837/locations/global/workloadIdentityPools/github-actions-v4/providers/github-v4
          service_account: github-v4-deployer@comunicamundo-v4.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect using existing runtime identity
        shell: bash
        run: |
          since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gcloud run jobs execute hefesto-v4-rebuild \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --args="inspect,--execution-run-id=${EXECUTION_ID}" --wait
          query="resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"hefesto-v4-rebuild\" AND timestamp>=\"${since}\""
          gcloud logging read "${query}" --project="${PROJECT_ID}" --limit=1000 --format=json > "${RUNNER_TEMP}/logs.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          entries = json.loads((Path(os.environ["RUNNER_TEMP"]) / "logs.json").read_text())
          execution_id = os.environ["EXECUTION_ID"]
          found = False
          for entry in entries:
              payload = entry.get("textPayload") or ""
              if execution_id not in payload or '"usage"' not in payload:
                  continue
              try:
                  receipt = json.loads(payload)
              except json.JSONDecodeError:
                  continue
              if receipt.get("execution_run_id") == execution_id:
                  print(json.dumps({
                      "execution_run_id": execution_id,
                      "status": receipt.get("status"),
                      "usage": receipt.get("usage"),
                      "stages": receipt.get("stages"),
                  }, ensure_ascii=False, indent=2))
                  found = True
                  break
          if not found:
              raise SystemExit("inspection receipt was not found in Cloud Run logs")
          PY
